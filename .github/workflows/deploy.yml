name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: xvi-group-v2/package-lock.json
      - run: npm ci
        working-directory: xvi-group-v2
      - run: npm run build
        working-directory: xvi-group-v2
      - run: cp dist/index.html dist/404.html
        working-directory: xvi-group-v2
      - uses: actions/upload-pages-artifact@v3
        with:
          path: xvi-group-v2/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
