<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="XVI GROUP — Premium AI, Technology & Strategy Advisory">
  <defs>
    <!-- White Gradient for dark backgrounds -->
    <linearGradient id="white-primary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="25%" stop-color="#F5F5F5"/>
      <stop offset="50%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    
    <linearGradient id="white-diagonal-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    
    <linearGradient id="white-diagonal-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#E0E0E0"/>
    </linearGradient>
    
    <linearGradient id="white-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#F5F5F5"/>
    </linearGradient>
    
    <linearGradient id="white-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F5F5F5"/>
      <stop offset="100%" stop-color="#D0D0D0"/>
    </linearGradient>
  </defs>
  
  <!-- XVI Mark Construction -->
  <g transform="translate(20, 20)">
    <!-- X Letter - Bar 1 -->
    <path d="M24 24 L144 124 L168 100 L48 0 Z" fill="url(#white-diagonal-left)"/>
    
    <!-- X Letter - Bar 2 -->
    <path d="M150 24 L30 124 L54 148 L174 48 Z" fill="url(#white-diagonal-right)"/>
    
    <!-- V Letter - Bar 1 -->
    <path d="M184 24 L264 124 L288 100 L208 0 Z" fill="url(#white-diagonal-left)"/>
    
    <!-- V Letter - Bar 2 -->
    <path d="M294 24 L214 124 L238 148 L318 48 Z" fill="url(#white-diagonal-right)"/>
    
    <!-- I Letter - Main vertical bar -->
    <rect x="344" y="0" width="24" height="148" fill="url(#white-primary)"/>
    
    <!-- I Letter - Top bevel -->
    <path d="M344 0 L368 0 L368 8 L344 8 Z" fill="url(#white-highlight)"/>
    
    <!-- I Letter - Bottom bevel -->
    <path d="M344 140 L368 140 L368 148 L344 148 Z" fill="url(#white-shadow)"/>
  </g>
  
  <!-- GROUP Text -->
  <text x="400" y="95" 
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="300" 
        font-size="64" 
        letter-spacing="8" 
        fill="url(#white-primary)">
    GROUP
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="125" 
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="300" 
        font-size="11" 
        letter-spacing="4" 
        fill="#FFFFFF" 
        opacity="0.6">
    INTELLIGENCE. INTEGRATED. IMPACT.
  </text>
</svg>
