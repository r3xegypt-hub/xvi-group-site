<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="XVI GROUP App Icon">
  <defs>
    <linearGradient id="bronze-primary-app" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="25%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#E8C98A"/>
      <stop offset="75%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <linearGradient id="bronze-diagonal-left-app" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <linearGradient id="bronze-diagonal-right-app" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <linearGradient id="bronze-highlight-app" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
    
    <linearGradient id="bronze-shadow-app" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#6D532A"/>
    </linearGradient>
  </defs>
  
  <!-- Background - Deep Navy -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="#060A10"/>
  
  <!-- XVI Mark - Centered with 25% padding -->
  <g transform="translate(64, 128)">
    <!-- X Letter - Bar 1 -->
    <path d="M32 32 L192 192 L224 160 L64 0 Z" fill="url(#bronze-diagonal-left-app)"/>
    
    <!-- X Letter - Bar 2 -->
    <path d="M208 32 L48 192 L80 224 L240 64 Z" fill="url(#bronze-diagonal-right-app)"/>
    
    <!-- V Letter - Bar 1 -->
    <path d="M256 32 L416 192 L448 160 L288 0 Z" fill="url(#bronze-diagonal-left-app)"/>
    
    <!-- V Letter - Bar 2 -->
    <path d="M432 32 L272 192 L304 224 L464 64 Z" fill="url(#bronze-diagonal-right-app)"/>
    
    <!-- I Letter - Main vertical bar -->
    <rect x="512" y="0" width="32" height="224" fill="url(#bronze-primary-app)"/>
    
    <!-- I Letter - Top bevel -->
    <path d="M512 0 L544 0 L544 16 L512 16 Z" fill="url(#bronze-highlight-app)"/>
    
    <!-- I Letter - Bottom bevel -->
    <path d="M512 208 L544 208 L544 224 L512 224 Z" fill="url(#bronze-shadow-app)"/>
  </g>
</svg>
