<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 4" role="img" aria-label="XVI GROUP Brand Divider">
  <defs>
    <linearGradient id="bronze-divider" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E8C98A" stop-opacity="0"/>
      <stop offset="20%" stop-color="#C9A96E" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#E8C98A" stop-opacity="0.6"/>
      <stop offset="80%" stop-color="#C9A96E" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#8A6A36" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- Main line -->
  <line x1="0" y1="2" x2="400" y2="2" stroke="url(#bronze-divider)" stroke-width="1"/>
  
  <!-- Accent dots -->
  <circle cx="200" cy="2" r="1.5" fill="#C9A96E"/>
</svg>
