<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 280" role="img" aria-label="XVI GROUP — Premium AI, Technology & Strategy Advisory">
  <defs>
    <linearGradient id="bronze-primary-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="25%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#E8C98A"/>
      <stop offset="75%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <linearGradient id="bronze-diagonal-left-vert" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <linearGradient id="bronze-diagonal-right-vert" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <linearGradient id="bronze-highlight-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
    
    <linearGradient id="bronze-shadow-vert" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#6D532A"/>
    </linearGradient>
  </defs>
  
  <!-- XVI Mark - Centered -->
  <g transform="translate(28, 20)">
    <!-- X Letter - Bar 1 -->
    <path d="M12 12 L72 72 L84 60 L24 0 Z" fill="url(#bronze-diagonal-left-vert)"/>
    
    <!-- X Letter - Bar 2 -->
    <path d="M84 12 L24 72 L36 84 L96 24 Z" fill="url(#bronze-diagonal-right-vert)"/>
    
    <!-- V Letter - Bar 1 -->
    <path d="M108 12 L168 72 L180 60 L120 0 Z" fill="url(#bronze-diagonal-left-vert)"/>
    
    <!-- V Letter - Bar 2 -->
    <path d="M180 12 L120 72 L132 84 L192 24 Z" fill="url(#bronze-diagonal-right-vert)"/>
    
    <!-- I Letter - Main vertical bar -->
    <rect x="216" y="0" width="24" height="84" fill="url(#bronze-primary-vert)"/>
    
    <!-- I Letter - Top bevel -->
    <path d="M216 0 L240 0 L240 8 L216 8 Z" fill="url(#bronze-highlight-vert)"/>
    
    <!-- I Letter - Bottom bevel -->
    <path d="M216 76 L240 76 L240 84 L216 84 Z" fill="url(#bronze-shadow-vert)"/>
  </g>
  
  <!-- GROUP Text - Below mark -->
  <text x="100" y="160" 
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="300" 
        font-size="48" 
        letter-spacing="6" 
        fill="url(#bronze-primary-vert)">
    GROUP
  </text>
  
  <!-- Subtitle -->
  <text x="100" y="185" 
        text-anchor="middle"
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="300" 
        font-size="10" 
        letter-spacing="3" 
        fill="#C9A96E" 
        opacity="0.5">
    INTELLIGENCE. INTEGRATED. IMPACT.
  </text>
  
  <!-- Decorative line -->
  <line x1="60" y1="205" x2="140" y2="205" stroke="url(#bronze-primary-vert)" stroke-width="1" opacity="0.3"/>
</svg>
