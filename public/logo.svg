<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" role="img" aria-label="XVI GROUP — Premium AI, Technology & Strategy Advisory">
  <defs>
    <!-- Primary Bronze Gradient -->
    <linearGradient id="bronze-primary" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="25%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#E8C98A"/>
      <stop offset="75%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <!-- Left Diagonal Gradient -->
    <linearGradient id="bronze-diagonal-left" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <!-- Right Diagonal Gradient -->
    <linearGradient id="bronze-diagonal-right" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <!-- Highlight Gradient -->
    <linearGradient id="bronze-highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
    
    <!-- Shadow Gradient -->
    <linearGradient id="bronze-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#6D532A"/>
    </linearGradient>
  </defs>
  
  <!-- XVI Mark Construction -->
  <g transform="translate(20, 20)">
    <!-- X Letter - Bar 1 (Left-to-right diagonal) -->
    <path d="M24 24 L144 124 L168 100 L48 0 Z" fill="url(#bronze-diagonal-left)"/>
    
    <!-- X Letter - Bar 2 (Right-to-left diagonal, offset for tension) -->
    <path d="M150 24 L30 124 L54 148 L174 48 Z" fill="url(#bronze-diagonal-right)"/>
    
    <!-- V Letter - Bar 1 (Left diagonal) -->
    <path d="M184 24 L264 124 L288 100 L208 0 Z" fill="url(#bronze-diagonal-left)"/>
    
    <!-- V Letter - Bar 2 (Right diagonal, converging at base) -->
    <path d="M294 24 L214 124 L238 148 L318 48 Z" fill="url(#bronze-diagonal-right)"/>
    
    <!-- I Letter - Main vertical bar -->
    <rect x="344" y="0" width="24" height="148" fill="url(#bronze-primary)"/>
    
    <!-- I Letter - Top bevel (45° cut, highlight) -->
    <path d="M344 0 L368 0 L368 8 L344 8 Z" fill="url(#bronze-highlight)"/>
    
    <!-- I Letter - Bottom bevel (45° cut, shadow渐变) -->
    <path d="M344 140 L368 140 L368 148 L344 148 Z" fill="url(#bronze-shadow)"/>
  </g>
  
  <!-- GROUP Text -->
  <text x="400" y="95" 
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="300" 
        font-size="64" 
        letter-spacing="8" 
        fill="url(#bronze-primary)">
    GROUP
  </text>
  
  <!-- Subtitle -->
  <text x="400" y="125" 
        font-family="'Plus Jakarta Sans', 'Helvetica Neue', Arial, sans-serif" 
        font-weight="300" 
        font-size="11" 
        letter-spacing="4" 
        fill="#C9A96E" 
        opacity="0.5">
    INTELLIGENCE. INTEGRATED. IMPACT.
  </text>
</svg>
