<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="XVI GROUP Brand Pattern">
  <defs>
    <linearGradient id="bronze-pattern" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="25%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#E8C98A"/>
      <stop offset="75%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <linearGradient id="bronze-diagonal-pattern" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <pattern id="xvi-pattern" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <!-- Small X mark -->
      <path d="M20 20 L40 40 L44 36 L24 16 Z" fill="url(#bronze-diagonal-pattern)" opacity="0.15"/>
      <path d="M44 20 L24 40 L28 44 L48 24 Z" fill="url(#bronze-diagonal-pattern)" opacity="0.15"/>
      
      <!-- Small V mark -->
      <path d="M60 20 L80 40 L84 36 L64 16 Z" fill="url(#bronze-diagonal-pattern)" opacity="0.15"/>
      <path d="M84 20 L64 40 L68 44 L88 24 Z" fill="url(#bronze-diagonal-pattern)" opacity="0.15"/>
      
      <!-- Small I mark -->
      <rect x="92" y="16" width="4" height="28" fill="url(#bronze-pattern)" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="400" fill="#FAF8F4"/>
  
  <!-- Pattern overlay -->
  <rect width="400" height="400" fill="url(#xvi-pattern)"/>
  
  <!-- Subtle diagonal lines -->
  <line x1="0" y1="0" x2="400" y2="400" stroke="url(#bronze-pattern)" stroke-width="0.5" opacity="0.08"/>
  <line x1="100" y1="0" x2="400" y2="300" stroke="url(#bronze-pattern)" stroke-width="0.5" opacity="0.08"/>
  <line x1="200" y1="0" x2="400" y2="200" stroke="url(#bronze-pattern)" stroke-width="0.5" opacity="0.08"/>
  <line x1="300" y1="0" x2="400" y2="100" stroke="url(#bronze-pattern)" stroke-width="0.5" opacity="0.08"/>
  
  <line x1="0" y1="100" x2="300" y2="400" stroke="url(#bronze-pattern)" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="200" x2="200" y2="400" stroke="url(#bronze-pattern)" stroke-width="0.5" opacity="0.08"/>
  <line x1="0" y1="300" x2="100" y2="400" stroke="url(#bronze-pattern)" stroke-width="0.5" opacity="0.08"/>
</svg>
