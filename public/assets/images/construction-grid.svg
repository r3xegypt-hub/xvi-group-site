<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="600" fill="#faf8f4"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="14" font-weight="700" letter-spacing="0.15em">XVI SIGNATURE MARK — CONSTRUCTION GRID</text>
  <text x="400" y="54" text-anchor="middle" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="10" letter-spacing="0.08em">XVI GROUP VISUAL IDENTITY — REFINED v2</text>

  <!-- Left: Construction grid -->
  <g transform="translate(40, 80)">
    <rect width="340" height="440" fill="white" rx="4" stroke="#e2ded6" stroke-width="0.5"/>

    <!-- Base grid — 16px module system -->
    <g stroke="#e2ded6" stroke-width="0.3" opacity="0.3">
      <line x1="0" y1="55" x2="340" y2="55"/><line x1="0" y1="110" x2="340" y2="110"/>
      <line x1="0" y1="165" x2="340" y2="165"/><line x1="0" y1="220" x2="340" y2="220"/>
      <line x1="0" y1="275" x2="340" y2="275"/><line x1="0" y1="330" x2="340" y2="330"/>
      <line x1="0" y1="385" x2="340" y2="385"/>
      <line x1="42.5" y1="0" x2="42.5" y2="440"/><line x1="85" y1="0" x2="85" y2="440"/>
      <line x1="127.5" y1="0" x2="127.5" y2="440"/><line x1="170" y1="0" x2="170" y2="440"/>
      <line x1="212.5" y1="0" x2="212.5" y2="440"/><line x1="255" y1="0" x2="255" y2="440"/>
      <line x1="297.5" y1="0" x2="297.5" y2="440"/>
    </g>

    <!-- Center axes -->
    <line x1="170" y1="0" x2="170" y2="440" stroke="#b8965a" stroke-width="0.5" opacity="0.4"/>
    <line x1="0" y1="220" x2="340" y2="220" stroke="#b8965a" stroke-width="0.5" opacity="0.4"/>

    <!-- Mark outline — Refined with signature offset -->
    <g fill="none" stroke="#0a0f18" stroke-width="5" stroke-linecap="butt" stroke-linejoin="miter">
      <line x1="64" y1="40" x2="100" y2="400"/>
      <line x1="103" y1="40" x2="67" y2="400"/>
      <path d="M124,40 L148,400 L172,40"/>
      <line x1="192" y1="40" x2="192" y2="400"/>
    </g>

    <!-- Signature accent point -->
    <g fill="#0a0f18">
      <rect x="82" y="218" width="4" height="4" transform="rotate(45 84 220)"/>
    </g>

    <!-- Dimension lines -->
    <line x1="56" y1="40" x2="56" y2="400" stroke="#b8965a" stroke-width="0.5"/>
    <line x1="52" y1="40" x2="60" y2="40" stroke="#b8965a" stroke-width="0.5"/>
    <line x1="52" y1="400" x2="60" y2="400" stroke="#b8965a" stroke-width="0.5"/>
    <text x="46" y="224" text-anchor="end" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600">192</text>

    <line x1="64" y1="410" x2="192" y2="410" stroke="#b8965a" stroke-width="0.5"/>
    <line x1="64" y1="406" x2="64" y2="414" stroke="#b8965a" stroke-width="0.5"/>
    <line x1="192" y1="406" x2="192" y2="414" stroke="#b8965a" stroke-width="0.5"/>
    <text x="128" y="426" text-anchor="middle" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600">128</text>

    <!-- Golden ratio note -->
    <text x="170" y="44" text-anchor="middle" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="7" letter-spacing="0.08em">RATIO: 192/128 = 1.5 (PERFECT 3:2)</text>

    <!-- X offset notation -->
    <text x="200" y="120" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="7" letter-spacing="0.05em">X OFFSET: 3px</text>

    <!-- Label -->
    <text x="170" y="448" text-anchor="middle" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8" letter-spacing="0.1em">MATHEMATICAL CONSTRUCTION — SIGNATURE MARK</text>
  </g>

  <!-- Right: Specifications -->
  <g transform="translate(420, 80)">
    <text x="170" y="0" text-anchor="middle" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700" letter-spacing="0.12em">SPECIFICATIONS</text>

    <g transform="translate(0, 24)">
      <text x="0" y="0" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" letter-spacing="0.08em">GEOMETRY</text>
      <text x="0" y="18" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Height: 192 units</text>
      <text x="0" y="32" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Width: 128 units</text>
      <text x="0" y="46" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Ratio: 1.5 (3:2 — architectural)</text>
      <text x="0" y="60" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Stroke: 14 units</text>
      <text x="0" y="74" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Line cap: Butt (custom chamfered)</text>
      <text x="0" y="88" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Line join: Miter (precise)</text>

      <text x="0" y="114" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" letter-spacing="0.08em">SIGNATURE ELEMENTS</text>
      <text x="0" y="132" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">X offset: 3 units (signature tension)</text>
      <text x="0" y="146" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">V angle: 72° from horizontal</text>
      <text x="0" y="160" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">I stroke: 90° (vertical)</text>
      <text x="0" y="174" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Accent: Diamond at X center</text>

      <text x="0" y="200" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" letter-spacing="0.08em">SPACING</text>
      <text x="0" y="218" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">X to V: 24 units (1.5× module)</text>
      <text x="0" y="232" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">V to I: 20 units (1.25× module)</text>
      <text x="0" y="246" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Consistent throughout</text>

      <text x="0" y="272" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" letter-spacing="0.08em">PROPORTIONS</text>
      <text x="0" y="290" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">X width: 39 units (30.5%)</text>
      <text x="0" y="304" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">V width: 48 units (37.5%)</text>
      <text x="0" y="318" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">I width: 0 units (line)</text>
      <text x="0" y="332" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Gaps: 24 + 20 units (32.0%)</text>
    </g>

    <!-- Color specifications -->
    <g transform="translate(0, 380)">
      <text x="0" y="0" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" letter-spacing="0.08em">COLORS</text>
      <rect x="0" y="12" width="16" height="16" fill="#060a10" rx="3"/>
      <text x="24" y="24" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Deep Navy: #060a10</text>
      <rect x="0" y="34" width="16" height="16" fill="#c9a96e" rx="3"/>
      <text x="24" y="46" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Executive Bronze: #c9a96e</text>
      <rect x="0" y="56" width="16" height="16" fill="#faf8f4" rx="3" stroke="#e2ded6" stroke-width="0.5"/>
      <text x="24" y="68" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Warm Ivory: #faf8f4</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="40" y1="560" x2="760" y2="560" stroke="#e2ded6" stroke-width="0.5"/>
  <text x="400" y="580" text-anchor="middle" fill="#c2beb5" font-family="Plus Jakarta Sans, sans-serif" font-size="8" letter-spacing="0.1em">XVI GROUP — BRAND IDENTITY SYSTEM — CONSTRUCTION GRID v2.0</text>
</svg>