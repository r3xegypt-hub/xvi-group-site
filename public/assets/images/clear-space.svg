<svg width="600" height="450" viewBox="0 0 600 450" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="450" fill="#faf8f4"/>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" letter-spacing="0.15em">CLEAR SPACE RULES</text>
  <text x="300" y="48" text-anchor="middle" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="9" letter-spacing="0.08em">XVI GROUP VISUAL IDENTITY — REFINED v2</text>

  <!-- Main diagram -->
  <g transform="translate(50, 70)">
    <rect width="500" height="280" fill="white" rx="4" stroke="#e2ded6" stroke-width="0.5"/>

    <!-- Clear space boundary -->
    <rect x="60" y="20" width="380" height="240" fill="none" stroke="#b8965a" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.5" rx="3"/>
    <rect x="60" y="20" width="380" height="240" fill="#c9a96e" opacity="0.04" rx="3"/>

    <!-- X dimension labels (top) -->
    <line x1="250" y1="20" x2="250" y2="4" stroke="#b8965a" stroke-width="0.8"/>
    <line x1="240" y1="20" x2="260" y2="20" stroke="#b8965a" stroke-width="0.8"/>
    <line x1="240" y1="4" x2="260" y2="4" stroke="#b8965a" stroke-width="0.8"/>
    <text x="250" y="0" text-anchor="middle" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" letter-spacing="0.05em">X = 56px (½ HEIGHT)</text>

    <!-- X dimension labels (bottom) -->
    <line x1="250" y1="260" x2="250" y2="276" stroke="#b8965a" stroke-width="0.8"/>
    <line x1="240" y1="260" x2="260" y2="260" stroke="#b8965a" stroke-width="0.8"/>
    <line x1="240" y1="276" x2="260" y2="276" stroke="#b8965a" stroke-width="0.8"/>
    <text x="250" y="290" text-anchor="middle" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" letter-spacing="0.05em">X = 56px (½ HEIGHT)</text>

    <!-- X dimension labels (left) -->
    <line x1="60" y1="140" x2="44" y2="140" stroke="#b8965a" stroke-width="0.8"/>
    <line x1="60" y1="130" x2="60" y2="150" stroke="#b8965a" stroke-width="0.8"/>
    <line x1="44" y1="130" x2="44" y2="150" stroke="#b8965a" stroke-width="0.8"/>
    <text x="36" y="144" text-anchor="middle" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" letter-spacing="0.05em" transform="rotate(-90, 36, 144)">X = 56px</text>

    <!-- X dimension labels (right) -->
    <line x1="440" y1="140" x2="456" y2="140" stroke="#b8965a" stroke-width="0.8"/>
    <line x1="440" y1="130" x2="440" y2="150" stroke="#b8965a" stroke-width="0.8"/>
    <line x1="456" y1="130" x2="456" y2="150" stroke="#b8965a" stroke-width="0.8"/>
    <text x="464" y="144" text-anchor="middle" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="9" font-weight="600" letter-spacing="0.05em" transform="rotate(90, 464, 144)">X = 56px</text>

    <!-- Mark — Refined signature -->
    <g transform="translate(144, 40)" fill="none" stroke="#0a0f18" stroke-width="5" stroke-linecap="butt" stroke-linejoin="miter">
      <line x1="0" y1="0" x2="36" y2="160"/>
      <line x1="39" y1="0" x2="3" y2="160"/>
      <path d="M56,0 L76,160 L96,0"/>
      <line x1="112" y1="0" x2="112" y2="160"/>
    </g>

    <!-- Signature accent -->
    <g fill="#0a0f18">
      <rect x="193" y="118" width="4" height="4" transform="rotate(45 195 120)"/>
    </g>

    <!-- Corner indicators -->
    <rect x="60" y="20" width="6" height="6" fill="#c9a96e" opacity="0.4"/>
    <rect x="434" y="20" width="6" height="6" fill="#c9a96e" opacity="0.4"/>
    <rect x="60" y="254" width="6" height="6" fill="#c9a96e" opacity="0.4"/>
    <rect x="434" y="254" width="6" height="6" fill="#c9a96e" opacity="0.4"/>
  </g>

  <!-- Rules text -->
  <g transform="translate(50, 380)">
    <text x="0" y="0" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="600" letter-spacing="0.08em">RULES:</text>
    <text x="55" y="0" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="9">1. Clear space = ½ height of the mark on all sides</text>
    <text x="55" y="16" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="9">2. Never place elements inside the clear space zone</text>
    <text x="55" y="32" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="9">3. On dark backgrounds: use logo.svg (bronze on navy)</text>
    <text x="55" y="48" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="9">4. On light backgrounds: use logo-dark.svg (navy on ivory)</text>
  </g>
</svg>