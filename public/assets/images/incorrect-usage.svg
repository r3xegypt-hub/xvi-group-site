<svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="500" fill="#faf8f4"/>

  <!-- Title -->
  <text x="400" y="32" text-anchor="middle" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" letter-spacing="0.15em">INCORRECT USAGE</text>
  <text x="400" y="48" text-anchor="middle" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="9" letter-spacing="0.08em">DO NOT USE THE MARK IN THESE WAYS</text>

  <!-- Row 1 -->
  <g transform="translate(40, 70)">

    <!-- 1. Don't stretch -->
    <g transform="translate(0, 0)">
      <rect width="160" height="120" fill="white" rx="4" stroke="#e2ded6" stroke-width="0.5"/>
      <g transform="translate(50, 15)">
        <g fill="none" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter" transform="scale(1.3, 0.8)">
          <line x1="0" y1="0" x2="20" y2="80"/>
          <line x1="21" y1="0" x2="1" y2="80"/>
          <path d="M28,0 L38,80 L48,0"/>
          <line x1="56" y1="0" x2="56" y2="80"/>
        </g>
      </g>
      <text x="80" y="110" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600">DON'T STRETCH</text>
      <circle cx="140" cy="15" r="10" fill="#dc2626" opacity="0.1"/>
      <text x="140" y="19" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">×</text>
    </g>

    <!-- 2. Don't rotate -->
    <g transform="translate(180, 0)">
      <rect width="160" height="120" fill="white" rx="4" stroke="#e2ded6" stroke-width="0.5"/>
      <g transform="translate(80, 60) rotate(30)">
        <g fill="none" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter">
          <line x1="-30" y1="-40" x2="-10" y2="40"/>
          <line x1="-9" y1="-40" x2="-29" y2="40"/>
          <path d="M0,-40 L10,40 L20,-40"/>
          <line x1="30" y1="-40" x2="30" y2="40"/>
        </g>
      </g>
      <text x="80" y="110" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600">DON'T ROTATE</text>
      <circle cx="140" cy="15" r="10" fill="#dc2626" opacity="0.1"/>
      <text x="140" y="19" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">×</text>
    </g>

    <!-- 3. Don't add effects -->
    <g transform="translate(360, 0)">
      <rect width="160" height="120" fill="white" rx="4" stroke="#e2ded6" stroke-width="0.5"/>
      <g transform="translate(50, 15)" filter="url(#blur)">
        <g fill="none" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter">
          <line x1="0" y1="0" x2="20" y2="80"/>
          <line x1="21" y1="0" x2="1" y2="80"/>
          <path d="M28,0 L38,80 L48,0"/>
          <line x1="56" y1="0" x2="56" y2="80"/>
        </g>
      </g>
      <defs><filter id="blur"><feGaussianBlur stdDeviation="2"/></filter></defs>
      <text x="80" y="110" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600">DON'T ADD EFFECTS</text>
      <circle cx="140" cy="15" r="10" fill="#dc2626" opacity="0.1"/>
      <text x="140" y="19" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">×</text>
    </g>

    <!-- 4. Don't change colors -->
    <g transform="translate(540, 0)">
      <rect width="160" height="120" fill="white" rx="4" stroke="#e2ded6" stroke-width="0.5"/>
      <g transform="translate(50, 15)">
        <g fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter">
          <line x1="0" y1="0" x2="20" y2="80"/>
          <line x1="21" y1="0" x2="1" y2="80"/>
          <path d="M28,0 L38,80 L48,0"/>
          <line x1="56" y1="0" x2="56" y2="80"/>
        </g>
      </g>
      <text x="80" y="110" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600">DON'T CHANGE COLORS</text>
      <circle cx="140" cy="15" r="10" fill="#dc2626" opacity="0.1"/>
      <text x="140" y="19" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">×</text>
    </g>
  </g>

  <!-- Row 2 -->
  <g transform="translate(40, 210)">

    <!-- 5. Don't add backgrounds -->
    <g transform="translate(0, 0)">
      <rect width="160" height="120" fill="white" rx="4" stroke="#e2ded6" stroke-width="0.5"/>
      <g transform="translate(20, 10)">
        <rect width="120" height="100" fill="#c9a96e" rx="8" opacity="0.15"/>
        <g transform="translate(30, 10)" fill="none" stroke="#0a0f18" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter">
          <line x1="0" y1="0" x2="20" y2="70"/>
          <line x1="21" y1="0" x2="1" y2="70"/>
          <path d="M28,0 L38,70 L48,0"/>
          <line x1="56" y1="0" x2="56" y2="70"/>
        </g>
      </g>
      <text x="80" y="110" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600">DON'T ADD BACKGROUNDS</text>
      <circle cx="140" cy="15" r="10" fill="#dc2626" opacity="0.1"/>
      <text x="140" y="19" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">×</text>
    </g>

    <!-- 6. Don't crop -->
    <g transform="translate(180, 0)">
      <rect width="160" height="120" fill="white" rx="4" stroke="#e2ded6" stroke-width="0.5"/>
      <g transform="translate(20, 5)">
        <clipPath id="crop"><rect width="120" height="50" y="25"/></clipPath>
        <g clip-path="url(#crop)" fill="none" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter">
          <line x1="10" y1="10" x2="30" y2="80"/>
          <line x1="31" y1="10" x2="11" y2="80"/>
          <path d="M38,10 L48,80 L58,10"/>
          <line x1="66" y1="10" x2="66" y2="80"/>
        </g>
      </g>
      <text x="80" y="110" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600">DON'T CROP</text>
      <circle cx="140" cy="15" r="10" fill="#dc2626" opacity="0.1"/>
      <text x="140" y="19" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">×</text>
    </g>

    <!-- 7. Don't use low contrast -->
    <g transform="translate(360, 0)">
      <rect width="160" height="120" fill="#e2ded6" rx="4" stroke="#c2beb5" stroke-width="0.5"/>
      <g transform="translate(50, 15)">
        <g fill="none" stroke="#c2beb5" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter">
          <line x1="0" y1="0" x2="20" y2="80"/>
          <line x1="21" y1="0" x2="1" y2="80"/>
          <path d="M28,0 L38,80 L48,0"/>
          <line x1="56" y1="0" x2="56" y2="80"/>
        </g>
      </g>
      <text x="80" y="110" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600">DON'T USE LOW CONTRAST</text>
      <circle cx="140" cy="15" r="10" fill="#dc2626" opacity="0.1"/>
      <text x="140" y="19" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">×</text>
    </g>

    <!-- 8. Don't outline -->
    <g transform="translate(540, 0)">
      <rect width="160" height="120" fill="white" rx="4" stroke="#e2ded6" stroke-width="0.5"/>
      <g transform="translate(50, 15)">
        <g fill="none" stroke="#c9a96e" stroke-width="1.5" stroke-linecap="butt" stroke-linejoin="miter">
          <line x1="0" y1="0" x2="20" y2="80"/>
          <line x1="21" y1="0" x2="1" y2="80"/>
          <path d="M28,0 L38,80 L48,0"/>
          <line x1="56" y1="0" x2="56" y2="80"/>
        </g>
        <g fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.3" stroke-linecap="butt" stroke-linejoin="miter">
          <line x1="-4" y1="-4" x2="24" y2="84"/>
          <line x1="25" y1="-4" x2="1" y2="84"/>
          <path d="M24,-4 L38,84 L52,-4"/>
          <line x1="60" y1="-4" x2="60" y2="84"/>
        </g>
      </g>
      <text x="80" y="110" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="8" font-weight="600">DON'T ADD OUTLINES</text>
      <circle cx="140" cy="15" r="10" fill="#dc2626" opacity="0.1"/>
      <text x="140" y="19" text-anchor="middle" fill="#dc2626" font-family="Plus Jakarta Sans, sans-serif" font-size="12" font-weight="700">×</text>
    </g>
  </g>

  <!-- Footer -->
  <line x1="40" y1="360" x2="760" y2="360" stroke="#e2ded6" stroke-width="0.5"/>
  <text x="400" y="380" text-anchor="middle" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8" letter-spacing="0.06em">ALWAYS USE THE OFFICIAL SVG FILES PROVIDED IN THE BRAND KIT</text>
  <text x="400" y="396" text-anchor="middle" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="8" letter-spacing="0.06em">WHEN IN DOUBT, CONSULT THE CONSTRUCTION GRID</text>

  <!-- Correct example -->
  <g transform="translate(280, 410)">
    <rect width="240" height="70" fill="white" rx="4" stroke="#22c55e" stroke-width="1" opacity="0.5"/>
    <g transform="translate(20, 10)">
      <g fill="none" stroke="#0a0f18" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter">
        <line x1="0" y1="0" x2="16" y2="50"/>
        <line x1="17" y1="0" x2="1" y2="50"/>
        <path d="M22,0 L28,50 L34,0"/>
        <line x1="40" y1="0" x2="40" y2="50"/>
      </g>
    </g>
    <text x="140" y="30" text-anchor="middle" fill="#22c55e" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700">✓ CORRECT USAGE</text>
    <text x="140" y="48" text-anchor="middle" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Use official SVG files at correct proportions</text>
  </g>
</svg>