<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="appIconTitle">
  <title id="appIconTitle">XVI GROUP</title>
  
  <defs>
    <linearGradient id="appBronze" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="25%" stop-color="#C9A96E"/>
      <stop offset="50%" stop-color="#E8C98A"/>
      <stop offset="75%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <linearGradient id="appHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="100%" stop-color="#C9A96E"/>
    </linearGradient>
    
    <linearGradient id="appShadow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#6D532A"/>
    </linearGradient>
    
    <linearGradient id="appLeftDiag" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
    
    <linearGradient id="appRightDiag" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8C98A"/>
      <stop offset="50%" stop-color="#C9A96E"/>
      <stop offset="100%" stop-color="#8A6A36"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="#060A10"/>
  
  <!-- XVI Mark — Centered with perfect padding -->
  <g transform="translate(88, 128)">
    <!-- X: Left diagonal -->
    <path d="M 0,0 L 36,0 L 165,240 L 129,240 Z" fill="url(#appLeftDiag)"/>
    <!-- X: Right diagonal -->
    <path d="M 150,0 L 186,0 L 57,240 L 21,240 Z" fill="url(#appRightDiag)"/>
    
    <!-- V: Left diagonal -->
    <path d="M 234,0 L 270,0 L 330,240 L 294,240 Z" fill="url(#appLeftDiag)"/>
    <!-- V: Right diagonal -->
    <path d="M 402,0 L 438,0 L 378,240 L 342,240 Z" fill="url(#appRightDiag)"/>
    
    <!-- I: Vertical bar -->
    <path d="M 486,15 L 522,15 L 522,225 L 486,225 Z" fill="url(#appBronze)"/>
    <!-- I: Top bevel -->
    <path d="M 486,15 L 504,0 L 522,15 L 504,30 Z" fill="url(#appHighlight)"/>
    <!-- I: Bottom bevel -->
    <path d="M 486,225 L 504,240 L 522,225 L 504,210 Z" fill="url(#appShadow)"/>
  </g>

</svg>