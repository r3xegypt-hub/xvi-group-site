<svg width="600" height="350" viewBox="0 0 600 350" xmlns="http://www.w3.org/2000/svg">
  <rect width="600" height="350" fill="#faf8f4"/>

  <!-- Title -->
  <text x="300" y="32" text-anchor="middle" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="13" font-weight="700" letter-spacing="0.15em">MINIMUM SIZE RULES</text>
  <text x="300" y="48" text-anchor="middle" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="9" letter-spacing="0.08em">XVI GROUP VISUAL IDENTITY — REFINED v2</text>

  <!-- Size examples -->
  <g transform="translate(40, 80)">

    <!-- 16px - Just X -->
    <g transform="translate(0, 0)">
      <rect width="40" height="40" fill="#060a10" rx="6"/>
      <g fill="none" stroke="#c9a96e" stroke-width="2" stroke-linecap="butt">
        <line x1="10" y1="8" x2="20" y2="32"/>
        <line x1="21" y1="8" x2="11" y2="32"/>
      </g>
      <text x="52" y="18" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700">16px</text>
      <text x="52" y="30" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Favicon, browser tab</text>
      <text x="52" y="42" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="7">USE X ONLY — FULL MARK TOO SMALL</text>
    </g>

    <!-- 24px - Full XVI -->
    <g transform="translate(0, 60)">
      <rect width="56" height="56" fill="#060a10" rx="8"/>
      <g fill="none" stroke="#c9a96e" stroke-width="2.5" stroke-linecap="butt" stroke-linejoin="miter">
        <line x1="12" y1="10" x2="20" y2="46"/>
        <line x1="21" y1="10" x2="13" y2="46"/>
        <path d="M24,10 L28,46 L32,10"/>
        <line x1="36" y1="10" x2="36" y2="46"/>
      </g>
      <text x="68" y="26" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700">24px</text>
      <text x="68" y="38" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Navigation, UI elements</text>
      <text x="68" y="50" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="7">RECOMMENDED MINIMUM FOR FULL MARK</text>
    </g>

    <!-- 32px -->
    <g transform="translate(0, 130)">
      <rect width="72" height="72" fill="#060a10" rx="10"/>
      <g fill="none" stroke="#c9a96e" stroke-width="3" stroke-linecap="butt" stroke-linejoin="miter">
        <line x1="14" y1="12" x2="26" y2="60"/>
        <line x1="27" y1="12" x2="15" y2="60"/>
        <path d="M30,12 L38,60 L46,12"/>
        <line x1="52" y1="12" x2="52" y2="60"/>
      </g>
      <text x="84" y="34" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700">32px</text>
      <text x="84" y="46" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Social media, cards</text>
      <text x="84" y="58" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="7">OPTIMAL FOR MOST USES</text>
    </g>

    <!-- 48px -->
    <g transform="translate(180, 0)">
      <rect width="96" height="96" fill="#060a10" rx="12"/>
      <g fill="none" stroke="#c9a96e" stroke-width="4" stroke-linecap="butt" stroke-linejoin="miter">
        <line x1="18" y1="16" x2="34" y2="80"/>
        <line x1="35" y1="16" x2="19" y2="80"/>
        <path d="M40,16 L50,80 L60,16"/>
        <line x1="68" y1="16" x2="68" y2="80"/>
      </g>
      <text x="108" y="44" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700">48px</text>
      <text x="108" y="56" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">App icons, avatars</text>
      <text x="108" y="68" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="7">FULL DETAIL VISIBLE</text>
    </g>

    <!-- 64px -->
    <g transform="translate(180, 110)">
      <rect width="128" height="128" fill="#060a10" rx="14"/>
      <g fill="none" stroke="#c9a96e" stroke-width="5" stroke-linecap="butt" stroke-linejoin="miter">
        <line x1="24" y1="20" x2="44" y2="108"/>
        <line x1="45" y1="20" x2="25" y2="108"/>
        <path d="M52,20 L66,108 L80,20"/>
        <line x1="88" y1="20" x2="88" y2="108"/>
      </g>
      <text x="140" y="60" fill="#0a0f18" font-family="Plus Jakarta Sans, sans-serif" font-size="10" font-weight="700">64px+</text>
      <text x="140" y="72" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8">Print, merchandise, signage</text>
      <text x="140" y="84" fill="#b8965a" font-family="Plus Jakarta Sans, sans-serif" font-size="7">MAXIMUM DETAIL</text>
    </g>
  </g>

  <!-- Footer rules -->
  <line x1="40" y1="320" x2="560" y2="320" stroke="#e2ded6" stroke-width="0.5"/>
  <text x="300" y="340" text-anchor="middle" fill="#6b7280" font-family="Plus Jakarta Sans, sans-serif" font-size="8" letter-spacing="0.06em">BELOW 16px: Use X only | 16-24px: Use full mark with increased stroke | ABOVE 24px: Standard mark</text>
</svg>