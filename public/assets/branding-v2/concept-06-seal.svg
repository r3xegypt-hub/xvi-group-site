<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- CONCEPT 06: THE SEAL -->
  <!-- Philosophy: Authority and heritage — XVI as a precision stamp of quality -->
  <!-- Reference: Porsche heritage × Braun authority — timeless, official, commanding -->
  
  <!-- Outer precision circle -->
  <circle cx="56" cy="60" r="52" fill="none" stroke="#C9A96E" stroke-width="2"/>
  
  <!-- Inner precision circle -->
  <circle cx="56" cy="60" r="44" fill="none" stroke="#C9A96E" stroke-width="1"/>
  
  <!-- XVI precision letterforms -->
  <g fill="#C9A96E">
    <!-- X -->
    <path d="M 28,28 L 36,28 L 56,92 L 48,92 Z"/>
    <path d="M 44,28 L 52,28 L 32,92 L 24,92 Z"/>
    <!-- V -->
    <path d="M 60,28 L 68,28 L 72,92 L 64,92 Z"/>
    <path d="M 84,28 L 92,28 L 88,92 L 80,92 Z"/>
    <!-- I -->
    <rect x="96" y="28" width="6" height="64"/>
  </g>
  
  <!-- GROUP wordmark -->
  <text x="128" y="72" fill="#C9A96E" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="10">GROUP</text>
</svg>