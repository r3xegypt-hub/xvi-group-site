<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- CONCEPT 09: THE FRAME -->
  <!-- Philosophy: Architectural containment — XVI precision within structural boundaries -->
  <!-- Reference: Linear structure × Stripe discipline — engineered, contained, exact -->
  
  <!-- Architectural frame — precise rectangular container -->
  <rect x="8" y="4" width="128" height="112" fill="none" stroke="#C9A96E" stroke-width="2"/>
  
  <!-- Inner structural lines -->
  <line x1="48" y1="4" x2="48" y2="116" stroke="#C9A96E" stroke-width="0.5"/>
  <line x1="88" y1="4" x2="88" y2="116" stroke="#C9A96E" stroke-width="0.5"/>
  
  <!-- XVI constructed within frame -->
  <g fill="#C9A96E">
    <!-- X -->
    <path d="M 16,16 L 28,16 L 44,104 L 32,104 Z"/>
    <path d="M 32,16 L 44,16 L 28,104 L 16,104 Z"/>
    <!-- V -->
    <path d="M 56,16 L 68,16 L 80,104 L 68,104 Z"/>
    <path d="M 80,16 L 92,16 L 80,104 L 68,104 Z"/>
    <!-- I -->
    <rect x="96" y="16" width="8" height="88"/>
  </g>
  
  <!-- GROUP wordmark -->
  <text x="152" y="72" fill="#C9A96E" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="10">GROUP</text>
</svg>