<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- CONCEPT 01: THE NEXUS -->
  <!-- Philosophy: Connected intelligence — nodes forming XVI like a neural constellation -->
  <!-- Reference: Anthropic star × Palantir constellation — abstract, mathematical -->
  
  <!-- XVI constructed from connected geometric nodes -->
  <g stroke="#C9A96E" stroke-width="3" fill="none">
    <!-- X diagonal connections -->
    <line x1="8" y1="8" x2="48" y2="112"/>
    <line x1="48" y1="8" x2="8" y2="112"/>
    <!-- V connections -->
    <line x1="64" y1="8" x2="84" y2="112"/>
    <line x1="104" y1="8" x2="84" y2="112"/>
    <!-- I connection -->
    <line x1="124" y1="8" x2="124" y2="112"/>
  </g>
  
  <!-- Precision nodes at vertices -->
  <g fill="#C9A96E">
    <circle cx="8" cy="8" r="5"/>
    <circle cx="48" cy="8" r="5"/>
    <circle cx="8" cy="112" r="5"/>
    <circle cx="48" cy="112" r="5"/>
    <circle cx="64" cy="8" r="5"/>
    <circle cx="104" cy="8" r="5"/>
    <circle cx="84" cy="112" r="5"/>
    <circle cx="124" cy="8" r="5"/>
    <circle cx="124" cy="112" r="5"/>
    <!-- Center intersection node -->
    <circle cx="28" cy="60" r="4"/>
  </g>
  
  <!-- GROUP wordmark -->
  <text x="152" y="72" fill="#C9A96E" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="10">GROUP</text>
</svg>