<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- CONCEPT 10: THE CUT -->
  <!-- Philosophy: Revelation through removal — XVI emerges from solid mass -->
  <!-- Reference: FedEx arrow simplicity × Apple negative space — hidden intelligence revealed -->
  
  <!-- Solid mass with XVI precision cuts -->
  <g fill="#C9A96E">
    <!-- Solid rectangular block -->
    <rect x="8" y="4" width="120" height="112" rx="0"/>
    
    <!-- Precision cuts revealing XVI in negative space -->
    <g fill="#060A10">
      <!-- X cuts -->
      <path d="M 20,16 L 32,16 L 52,104 L 40,104 Z"/>
      <path d="M 40,16 L 52,16 L 32,104 L 20,104 Z"/>
      <!-- V cuts -->
      <path d="M 60,16 L 72,16 L 84,104 L 72,104 Z"/>
      <path d="M 92,16 L 104,16 L 92,104 L 80,104 Z"/>
      <!-- I cut -->
      <rect x="108" y="16" width="6" height="88"/>
    </g>
  </g>
  
  <!-- GROUP wordmark -->
  <text x="144" y="72" fill="#C9A96E" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="10">GROUP</text>
</svg>