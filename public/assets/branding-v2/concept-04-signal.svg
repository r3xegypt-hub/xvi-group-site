<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- CONCEPT 04: THE SIGNAL -->
  <!-- Philosophy: Digital intelligence — XVI emerges from signal frequency patterns -->
  <!-- Reference: Stripe simplicity × Arc fluidity — dynamic, precise, alive -->
  
  <!-- Signal frequency bars forming XVI -->
  <g fill="#C9A96E">
    <!-- X: Two crossing signal patterns -->
    <rect x="8" y="8" width="4" height="104"/>
    <rect x="16" y="24" width="4" height="72"/>
    <rect x="24" y="40" width="4" height="40"/>
    <rect x="32" y="56" width="4" height="8"/>
    <rect x="40" y="40" width="4" height="40"/>
    <rect x="48" y="24" width="4" height="72"/>
    <rect x="56" y="8" width="4" height="104"/>
    
    <!-- V: Signal pattern -->
    <rect x="72" y="8" width="4" height="104"/>
    <rect x="80" y="24" width="4" height="72"/>
    <rect x="88" y="40" width="4" height="40"/>
    <rect x="96" y="24" width="4" height="72"/>
    <rect x="104" y="8" width="4" height="104"/>
    
    <!-- I: Vertical signal -->
    <rect x="120" y="8" width="4" height="104"/>
  </g>
  
  <!-- GROUP wordmark -->
  <text x="144" y="72" fill="#C9A96E" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="10">GROUP</text>
</svg>