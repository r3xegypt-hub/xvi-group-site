<svg width="400" height="120" viewBox="0 0 400 120" xmlns="http://www.w3.org/2000/svg">
  <!-- CONCEPT 11: THE ASSEMBLY -->
  <!-- Philosophy: Geometric primitives — XVI constructed from fundamental shapes -->
  <!-- Reference: Notion construction × Arc precision — modular, mathematical, clean -->
  
  <!-- XVI assembled from geometric primitives -->
  <g fill="#C9A96E">
    <!-- X: Two triangles -->
    <polygon points="8,8 56,8 32,112"/>
    <polygon points="8,112 56,112 32,8" fill="#060A10"/>
    
    <!-- V: Two triangles converging -->
    <polygon points="64,8 88,8 80,112"/>
    <polygon points="104,8 128,8 96,112"/>
    
    <!-- I: Rectangle -->
    <rect x="140" y="8" width="8" height="104"/>
  </g>
  
  <!-- Accent circles at vertices -->
  <g fill="#C9A96E">
    <circle cx="32" cy="8" r="4"/>
    <circle cx="32" cy="112" r="4"/>
    <circle cx="80" cy="112" r="4"/>
    <circle cx="144" cy="8" r="4"/>
    <circle cx="144" cy="112" r="4"/>
  </g>
  
  <!-- GROUP wordmark -->
  <text x="164" y="72" fill="#C9A96E" font-family="Helvetica Neue, Arial, sans-serif" font-size="34" font-weight="300" letter-spacing="10">GROUP</text>
</svg>