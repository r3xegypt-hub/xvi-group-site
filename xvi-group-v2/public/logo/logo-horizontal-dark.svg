<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 80" fill="none">
  <!-- XVI GROUP — Premium Horizontal Logo (Dark Mode) -->
  
  <!-- XVI Mark with premium hexagon -->
