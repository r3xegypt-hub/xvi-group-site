<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 32" fill="none" aria-label="XVI GROUP">
  <!-- XVI GROUP — Horizontal Lockup (Dark Mode) — Path-based letterforms -->
  
  <!-- Diamond mark -->
  <path d="M16 2 L30 16 L16 30 L2 16 Z" 
        stroke="#FFFFFF" 
        stroke-width="1.5" 
        fill="none"/>
  
  <!-- XVI letterforms — white -->
  <!-- X -->
  <path d="M10.2 14.2 L12 17" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M12 14.2 L10.2 17" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  <!-- V -->
  <path d="M13 14.2 L14.5 17 L16 14.2" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- I -->
  <path d="M18.5 14.2 L18.5 17" stroke="#FFFFFF" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Meridian line — gold -->
  <line x1="38" y1="16" x2="68" y2="16" 
        stroke="#C9A96E" 
        stroke-width="1.5"/>
  
  <!-- GROUP text — Inter Medium, tracked +0.15em -->
  <text x="76" y="17" 
        dominant-baseline="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="10" 
        font-weight="500" 
        fill="#FFFFFF" 
        letter-spacing="0.15em">GROUP</text>
</svg>
