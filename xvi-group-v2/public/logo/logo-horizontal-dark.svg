        stroke="#F8F9FA" 
        stroke-width="1.5" 
        fill="none"
        opacity="0.8"/>
  
  <!-- XVI Letters -->
  <line x1="22" y1="18" x2="34" y2="38" stroke="#F8F9FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="34" y1="18" x2="22" y2="38" stroke="#F8F9FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="40" y1="18" x2="52" y2="38" stroke="#F8F9FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="52" y1="18" x2="40" y2="38" stroke="#F8F9FA" stroke-width="2" stroke-linecap="round"/>
  <line x1="58" y1="18" x2="58" y2="38" stroke="#F8F9FA" stroke-width="2" stroke-linecap="round"/>
  
  <!-- Meridian Line -->
  <line x1="16" y1="44" x2="64" y2="44" stroke="#C9A96E" stroke-width="1" stroke-linecap="round"/>
  
  <!-- Gold accent dots -->
  <circle cx="12" cy="28" r="1" fill="#C9A96E" opacity="0.5"/>
  <circle cx="68" cy="28" r="1" fill="#C9A96E" opacity="0.5"/>
  
  <!-- GROUP text -->
  <text x="80" y="32" 
