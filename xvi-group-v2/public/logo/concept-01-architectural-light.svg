<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none">
  <!-- Concept 01: The Architectural Mark — Light (for dark backgrounds) -->
  
  <!-- X -->
  <line x1="24" y1="20" x2="52" y2="56" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square"/>
  <line x1="52" y1="20" x2="24" y2="56" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square"/>
  
  <!-- V -->
  <line x1="72" y1="20" x2="92" y2="56" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square"/>
  <line x1="92" y1="20" x2="112" y2="56" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square"/>
  
  <!-- I -->
  <line x1="136" y1="20" x2="136" y2="56" stroke="#FFFFFF" stroke-width="3" stroke-linecap="square"/>
  <line x1="128" y1="56" x2="144" y2="56" stroke="#FFFFFF" stroke-width="2" stroke-linecap="square"/>
  <line x1="128" y1="20" x2="144" y2="20" stroke="#FFFFFF" stroke-width="2" stroke-linecap="square"/>
  
  <!-- Gold underline -->
  <line x1="16" y1="68" x2="152" y2="68" stroke="#C9A96E" stroke-width="1.5"/>
  
  <!-- GROUP -->
  <text x="16" y="90" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="500" fill="rgba(255,255,255,0.7)" letter-spacing="6">GROUP</text>
</svg>
