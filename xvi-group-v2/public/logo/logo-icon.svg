<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- LOGO ICON — XVI mark only, for nav and small spaces -->
  
  <!-- X -->
  <line x1="8" y1="8" x2="24" y2="32" stroke="#0A1628" stroke-width="3" stroke-linecap="square"/>
  <line x1="24" y1="8" x2="8" y2="32" stroke="#0A1628" stroke-width="3" stroke-linecap="square"/>
  
  <!-- V -->
  <line x1="28" y1="8" x2="36" y2="32" stroke="#0A1628" stroke-width="3" stroke-linecap="square"/>
  <line x1="36" y1="8" x2="44" y2="32" stroke="#0A1628" stroke-width="3" stroke-linecap="square"/>
  
  <!-- I -->
  <line x1="56" y1="8" x2="56" y2="32" stroke="#0A1628" stroke-width="3" stroke-linecap="square"/>
  <line x1="50" y1="8" x2="62" y2="8" stroke="#0A1628" stroke-width="1.5" stroke-linecap="square"/>
  <line x1="50" y1="32" x2="62" y2="32" stroke="#0A1628" stroke-width="1.5" stroke-linecap="square"/>
  
  <!-- Meridian -->
  <line x1="4" y1="40" x2="60" y2="40" stroke="#C9A96E" stroke-width="1"/>
  
  <!-- GROUP small -->
  <text x="32" y="54" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="7" font-weight="500" fill="#5A6472" letter-spacing="3">GROUP</text>
</svg>
