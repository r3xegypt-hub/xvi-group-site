<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Concept 05: The Kinetic Nexus — Dark with Gold Intersection -->
  
  <!-- Triangle pointing right (Strategy) -->
  <path d="M40 60 L100 100 L40 140 Z" stroke="#0A1628" stroke-width="2" fill="none" stroke-linejoin="miter"/>
  
  <!-- Triangle pointing down (Technology) -->
  <path d="M60 40 L140 40 L100 120 Z" stroke="#0A1628" stroke-width="2" fill="none" stroke-linejoin="miter"/>
  
  <!-- Vertical line (Execution) -->
  <line x1="100" y1="30" x2="100" y2="170" stroke="#0A1628" stroke-width="2" stroke-linecap="square"/>
  
  <!-- Intersection diamond — gold accent -->
  <path d="M80 80 L100 60 L120 80 L100 100 Z" fill="#C9A96E" opacity="0.9"/>
  
  <!-- XVI text below -->
  <text x="100" y="185" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="4">XVI</text>
</svg>
