<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 110" fill="none">
  <!-- Concept 04: The Meridian Line — Dark -->
  <style>
    .meridian-xvi { font-family: 'Playfair Display', Georgia, serif; }
    .meridian-group { font-family: 'Inter', -apple-system, sans-serif; }
  </style>
  
  <!-- XVI above meridian -->
  <text x="0" y="48" class="meridian-xvi" font-size="52" font-weight="700" fill="#0A1628" letter-spacing="-1">XVI</text>
  
  <!-- Meridian line — gold, extends beyond text -->
  <line x1="-8" y1="62" x2="160" y2="62" stroke="#C9A96E" stroke-width="1.5"/>
  
  <!-- GROUP below meridian -->
  <text x="0" y="92" class="meridian-group" font-size="15" font-weight="400" fill="#5A6472" letter-spacing="8">GROUP</text>
</svg>
