<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- Concept 03: The Precision Monogram — Dark -->
  
  <!-- Outer diamond (X structure) -->
  <path d="M100 16 L184 100 L100 184 L16 100 Z" stroke="#0A1628" stroke-width="2.5" fill="none" stroke-linejoin="miter"/>
  
  <!-- Inner V (inverted, inside diamond) -->
  <path d="M100 40 L140 100 L100 160" stroke="#0A1628" stroke-width="2" fill="none" stroke-linecap="square" stroke-linejoin="miter"/>
  
  <!-- I (vertical axis through center) -->
  <line x1="100" y1="28" x2="100" y2="172" stroke="#C9A96E" stroke-width="2" stroke-linecap="square"/>
  
  <!-- Center intersection accent -->
  <circle cx="100" cy="100" r="4" fill="#C9A96E"/>
  
  <!-- GROUP below -->
  <text x="100" y="200" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="12" font-weight="500" fill="#5A6472" letter-spacing="4">GROUP</text>
</svg>
