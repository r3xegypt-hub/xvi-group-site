<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none">
  <!-- Concept 02: The Sovereign Wordmark — Dark -->
  <style>
    .wordmark { font-family: 'Playfair Display', Georgia, serif; }
    .group-mark { font-family: 'Inter', -apple-system, sans-serif; }
  </style>
  
  <!-- XVI in high-contrast serif -->
  <text x="0" y="52" class="wordmark" font-size="64" font-weight="700" fill="#0A1628" letter-spacing="-2">XVI</text>
  
  <!-- GROUP in tracked sans-serif -->
  <text x="2" y="82" class="group-mark" font-size="16" font-weight="400" fill="#5A6472" letter-spacing="12">GROUP</text>
</svg>
