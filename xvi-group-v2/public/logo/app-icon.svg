<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" aria-label="XVI GROUP">
  <!-- XVI GROUP — App Icon (Navy background, gold diamond) — Path-based letterforms -->
  
  <!-- Background with rounded corners (22% iOS standard) -->
  <rect width="512" height="512" rx="112" fill="#0A1628"/>
  
  <!-- Diamond mark centered with 25% padding -->
  <path d="M256 128 L384 256 L256 384 L128 256 Z" 
        stroke="#C9A96E" 
        stroke-width="6" 
        fill="none"/>
  
  <!-- XVI letterforms — gold -->
  <!-- X -->
  <path d="M204 242 L220 268" stroke="#C9A96E" stroke-width="6" stroke-linecap="round"/>
  <path d="M220 242 L204 268" stroke="#C9A96E" stroke-width="6" stroke-linecap="round"/>
  <!-- V -->
  <path d="M228 242 L250 268 L272 242" stroke="#C9A96E" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- I -->
  <path d="M292 242 L292 268" stroke="#C9A96E" stroke-width="6" stroke-linecap="round"/>
</svg>
