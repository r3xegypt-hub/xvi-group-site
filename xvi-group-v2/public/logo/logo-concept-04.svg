<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" fill="none">
  <!-- CONCEPT 04: THE MERIDIAN LINE — The Standard -->
  
  <!-- XVI above meridian -->
  <text x="0" y="60" font-family="'Playfair Display', Georgia, serif" font-size="64" font-weight="700" fill="#0A1628" letter-spacing="-1">XVI</text>
  
  <!-- Meridian line — gold, extends beyond text -->
  <line x1="-12" y1="76" x2="200" y2="76" stroke="#C9A96E" stroke-width="1.5"/>
  
  <!-- GROUP below meridian -->
  <text x="0" y="104" font-family="Inter, -apple-system, sans-serif" font-size="16" font-weight="400" fill="#5A6472" letter-spacing="10">GROUP</text>
</svg>
