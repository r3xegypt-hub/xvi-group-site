<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" aria-label="XVI GROUP">
  <!-- XVI GROUP — Loader / Splash — Premium animated diamond -->
  
  <!-- Outer diamond — draws in -->
  <path d="M60 12 L108 60 L60 108 L12 60 Z" 
        stroke="#C9A96E" 
        stroke-width="2" 
        fill="none"
        stroke-linejoin="miter"
        stroke-dasharray="320"
        stroke-dashoffset="320"
        class="loader-diamond"/>
  
  <!-- Inner diamond — draws in delayed -->
  <path d="M60 30 L90 60 L60 90 L30 60 Z" 
        stroke="#C9A96E" 
        stroke-width="1" 
        fill="none" 
        opacity="0.3"
        stroke-dasharray="180"
        stroke-dashoffset="180"
        class="loader-diamond-inner"/>
  
  <!-- XVI — fades in -->
  <g opacity="0" class="loader-text">
    <path d="M42 54 L52 60" stroke="#C9A96E" stroke-width="3" stroke-linecap="round"/>
    <path d="M52 54 L42 60" stroke="#C9A96E" stroke-width="3" stroke-linecap="round"/>
    <path d="M60 54 L65 60 L70 54" stroke="#C9A96E" stroke-width="3" stroke-linecap="round" stroke-linejoin="miter"/>
    <line x1="80" y1="52" x2="80" y2="62" stroke="#C9A96E" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>