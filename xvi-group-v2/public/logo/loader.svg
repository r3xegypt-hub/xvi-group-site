<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- LOADER — Geometric draw-in animation concept -->
  <style>
    .loader-stroke {
      stroke: #C9A96E;
      stroke-width: 1.5;
      stroke-linecap: square;
      fill: none;
      stroke-dasharray: 200;
      stroke-dashoffset: 200;
    }
    .loader-stroke:nth-child(1) { animation: drawLine 1.2s cubic-bezier(0.16, 1, 0.3, 1) 0s forwards; }
    .loader-stroke:nth-child(2) { animation: drawLine 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards; }
    .loader-stroke:nth-child(3) { animation: drawLine 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards; }
    .loader-dot {
      fill: #C9A96E;
      opacity: 0;
      animation: appear 0.3s ease-out 1s forwards;
    }
    @keyframes drawLine {
      to { stroke-dashoffset: 0; }
    }
    @keyframes appear {
      to { opacity: 1; }
    }
  </style>
  
  <!-- Diamond draws in -->
  <path class="loader-stroke" d="M32 4 L60 32 L32 60 L4 32 Z"/>
  <!-- V draws in -->
  <path class="loader-stroke" d="M32 16 L44 32 L32 48"/>
  <!-- I draws in -->
  <line class="loader-stroke" x1="32" y1="8" x2="32" y2="56"/>
  <!-- Center dot appears -->
  <circle class="loader-dot" cx="32" cy="32" r="2.5"/>
</svg>
