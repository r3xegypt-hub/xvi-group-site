<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 96" fill="none" aria-label="XVI GROUP">
  <!-- XVI GROUP — Vertical Lockup (Light Mode) — Path-based letterforms -->
  
  <!-- Diamond mark centered -->
  <path d="M40 4 L60 24 L40 44 L20 24 Z" 
        stroke="#0A1628" 
        stroke-width="1.5" 
        fill="none"/>
  
  <!-- XVI letterforms inside diamond -->
  <!-- X -->
  <path d="M33 21 L35.5 25" stroke="#0A1628" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M35.5 21 L33 25" stroke="#0A1628" stroke-width="1.3" stroke-linecap="round"/>
  <!-- V -->
  <path d="M36.5 21 L39 25 L41.5 21" stroke="#0A1628" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- I -->
  <path d="M44 21 L44 25" stroke="#0A1628" stroke-width="1.3" stroke-linecap="round"/>
  
  <!-- Meridian line centered -->
  <line x1="16" y1="52" x2="64" y2="52" 
        stroke="#C9A96E" 
        stroke-width="1.5"/>
  
  <!-- GROUP text centered — Inter Medium -->
  <text x="40" y="72" 
        text-anchor="middle"
        font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" 
        font-size="9" 
        font-weight="500" 
        fill="#5A6472" 
        letter-spacing="0.15em">GROUP</text>
</svg>
