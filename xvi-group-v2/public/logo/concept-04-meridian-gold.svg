<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 100" fill="none">
  <!-- Concept 04: The Meridian Line — Gold (Premium) -->
  <style>
    .meridian-xvi { font-family: 'Playfair Display', Georgia, serif; }
    .meridian-group { font-family: 'Inter', -apple-system, sans-serif; }
  </style>
  
  <!-- XVI in gold -->
  <text x="0" y="48" class="meridian-xvi" font-size="52" font-weight="700" fill="#C9A96E" letter-spacing="-1">XVI</text>
  
  <!-- Meridian line -->
  <line x1="-8" y1="62" x2="160" y2="62" stroke="#C9A96E" stroke-width="1.5"/>
  
  <!-- GROUP in gold with reduced opacity -->
  <text x="0" y="92" class="meridian-group" font-size="15" font-weight="400" fill="rgba(201, 169, 110, 0.7)" letter-spacing="8">GROUP</text>
</svg>
