<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- CONCEPT 05: THE KINETIC NEXUS — Three Pillars Converge -->
  
  <!-- Triangle pointing right — Strategy -->
  <path d="M48 72 L120 120 L48 168 Z" stroke="#0A1628" stroke-width="2" fill="none" stroke-linejoin="miter"/>
  
  <!-- Triangle pointing down — Technology -->
  <path d="M72 48 L168 48 L120 136 Z" stroke="#0A1628" stroke-width="2" fill="none" stroke-linejoin="miter"/>
  
  <!-- Vertical line — Execution -->
  <line x1="120" y1="32" x2="120" y2="208" stroke="#0A1628" stroke-width="2" stroke-linecap="square"/>
  
  <!-- Intersection diamond — the nexus point -->
  <path d="M96 96 L120 72 L144 96 L120 120 Z" fill="#C9A96E" opacity="0.85"/>
  
  <!-- XVI text below -->
  <text x="120" y="228" text-anchor="middle" font-family="Inter, -apple-system, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="6">XVI</text>
</svg>
