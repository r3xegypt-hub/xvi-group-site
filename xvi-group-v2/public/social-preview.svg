<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <!-- XVI GROUP — Social Preview Image -->
  
  <!-- Background -->
  <rect width="1200" height="630" fill="#0A1628"/>
  
  <!-- Subtle geometric pattern -->
  <path d="M0 0 L1200 0 L1200 630 L0 630 Z" fill="url(#pattern)" opacity="0.03"/>
  
  <!-- Gold accent line -->
  <line x1="80" y1="80" x2="200" y2="80" stroke="#C9A96E" stroke-width="2"/>
  
  <!-- XVI Mark - Large -->
  <path d="M100 120 L180 160 L180 280 L100 320 L20 280 L20 160 Z" 
        stroke="#F8F9FA" 
        stroke-width="3" 
        fill="none"
        opacity="0.9"/>
  
  <!-- XVI Letters -->
  <line x1="40" y1="170" x2="80" y2="270" stroke="#F8F9FA" stroke-width="5" stroke-linecap="round"/>
  <line x1="80" y1="170" x2="40" y2="270" stroke="#F8F9FA" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="170" x2="140" y2="270" stroke="#F8F9FA" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="170" x2="100" y2="270" stroke="#F8F9FA" stroke-width="5" stroke-linecap="round"/>
  <line x1="160" y1="170" x2="160" y2="270" stroke="#F8F9FA" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Meridian Line -->
  <line x1="20" y1="300" x2="180" y2="300" stroke="#C9A96E" stroke-width="2"/>
  
  <!-- Company Name -->
  <text x="240" y="180" 
        font-family="Inter, -apple-system, sans-serif" 
        font-size="72" 
        font-weight="200" 
        fill="#F8F9FA" 
        letter-spacing="12">XVI GROUP</text>
  
  <!-- Tagline -->
  <text x="240" y="240" 
        font-family="Playfair Display, Georgia, serif" 
        font-size="28" 
        font-weight="400" 
        fill="#C9A96E"
        font-style="italic">Strategy. Intelligence. Operational Mastery.</text>
  
  <!-- Description -->
  <text x="240" y="300" 
        font-family="Inter, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="300" 
        fill="#8B95A5">Executive consulting for enterprises demanding precision, speed, and operational excellence.</text>
  
  <!-- Website -->
  <text x="240" y="380" 
        font-family="Inter, -apple-system, sans-serif" 
        font-size="18" 
        font-weight="400" 
        fill="#5A6472"
        letter-spacing="2">xvi-group.com</text>
  
  <!-- Decorative elements -->
  <circle cx="1100" cy="100" r="40" fill="#C9A96E" opacity="0.1"/>
  <circle cx="1150" cy="530" r="60" fill="#C9A96E" opacity="0.05"/>
  
  <!-- Gold accent dots -->
  <circle cx="1050" cy="200" r="3" fill="#C9A96E" opacity="0.6"/>
  <circle cx="1100" cy="400" r="3" fill="#C9A96E" opacity="0.4"/>
  <circle cx="1150" cy="300" r="3" fill="#C9A96E" opacity="0.5"/>
  
  <defs>
    <pattern id="pattern" patternUnits="userSpaceOnUse" width="40" height="40">
      <path d="M0 20 L20 0 L40 20 L20 40 Z" stroke="#F8F9FA" stroke-width="0.5" fill="none"/>
    </pattern>
  </defs>
</svg>