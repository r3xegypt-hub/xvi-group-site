<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- PATTERN 01: THE DIAMOND FIELD — Hero/section background -->
  <defs>
    <pattern id="diamondField" x="0" y="0" width="48" height="48" patternUnits="userSpaceOnUse">
      <!-- Diamond shape -->
      <path d="M24 4 L44 24 L24 44 L4 24 Z" stroke="#C9A96E" stroke-width="0.5" fill="none" opacity="0.15"/>
    </pattern>
  </defs>
  
  <!-- Apply pattern -->
