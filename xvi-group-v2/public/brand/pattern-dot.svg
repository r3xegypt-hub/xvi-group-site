<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- PATTERN 04: THE ARCHITECTURAL DOT — Subtle background texture -->
  <defs>
    <pattern id="archDot" x="0" y="0" width="24" height="24" patternUnits="userSpaceOnUse">
      <!-- Dot -->
      <circle cx="12" cy="12" r="1" fill="#C9A96E" opacity="0.2"/>
    </pattern>
  </defs>
  
  <!-- Apply pattern -->
  <rect width="800" height="400" fill="url(#archDot)"/>
</svg>
