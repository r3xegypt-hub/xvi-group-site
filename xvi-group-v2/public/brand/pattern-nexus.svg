<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" fill="none">
  <!-- PATTERN 03: THE NEXUS FIELD — Technology section background -->
  <defs>
    <pattern id="nexusField" x="0" y="0" width="64" height="64" patternUnits="userSpaceOnUse">
      <!-- Diamond node -->
      <path d="M32 8 L56 32 L32 56 L8 32 Z" stroke="#0A1628" stroke-width="0.5" fill="none" opacity="0.05"/>
      <!-- Center dot -->
      <circle cx="32" cy="32" r="2" fill="#C9A96E" opacity="0.08"/>
      <!-- Horizontal connector -->
      <line x1="0" y1="32" x2="8" y2="32" stroke="#0A1628" stroke-width="0.3" opacity="0.05"/>
      <line x1="56" y1="32" x2="64" y2="32" stroke="#0A1628" stroke-width="0.3" opacity="0.05"/>
      <!-- Vertical connector -->
      <line x1="32" y1="0" x2="32" y2="8" stroke="#0A1628" stroke-width="0.3" opacity="0.05"/>
      <line x1="32" y1="56" x2="32" y2="64" stroke="#0A1628" stroke-width="0.3" opacity="0.05"/>
    </pattern>
  </defs>
  
  <!-- Apply pattern -->
  <rect width="800" height="400" fill="url(#nexusField)"/>
</svg>
