<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" fill="none">
  <!-- Brand Pattern — Repeating geometric motif -->
  
  <defs>
    <pattern id="brandPattern" x="0" y="0" width="80" height="80" patternUnits="userSpaceOnUse">
      <!-- Diamond shape -->
      <path d="M40 8 L72 40 L40 72 L8 40 Z" stroke="#C9A96E" stroke-width="0.5" fill="none" opacity="0.15"/>
      <!-- Center dot -->
      <circle cx="40" cy="40" r="1.5" fill="#C9A96E" opacity="0.2"/>
    </pattern>
  </defs>
  
  <rect width="1200" height="200" fill="url(#brandPattern)"/>
</svg>
