<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;family=Amiri:wght@400;700&amp;family=Tajawal:wght@400;500;700&amp;display=swap');
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="800" fill="#F4F5F7"/>

  <!-- Title -->
  <text x="600" y="50" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="500" fill="#C9A96E" letter-spacing="0.14em">XVI GROUP — BRAND IDENTITY PREVIEW</text>

  <!-- ========== SECTION 1: LOGO VARIANTS ========== -->
  <text x="80" y="110" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5A6472" letter-spacing="0.1em">LOGO SYSTEM</text>

  <!-- Horizontal — Navy -->
  <rect x="80" y="130" width="280" height="80" rx="8" fill="#FFFFFF" stroke="rgba(201,169,110,0.12)" stroke-width="1"/>
  <path d="M120 165 L135 150 L150 165 L135 180 Z" stroke="#0A1628" stroke-width="2" fill="none"/>
  <text x="165" y="172" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#0A1628" letter-spacing="0.08em">XVI</text>
  <circle cx="215" cy="165" r="1.5" fill="#C9A96E"/>
  <text x="230" y="172" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#0A1628" letter-spacing="0.12em">GROUP</text>

  <!-- Horizontal — White on Navy -->
  <rect x="380" y="130" width="280" height="80" rx="8" fill="#0A1628"/>
  <path d="M420 165 L435 150 L450 165 L435 180 Z" stroke="#FFFFFF" stroke-width="2" fill="none"/>
  <text x="465" y="172" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#FFFFFF" letter-spacing="0.08em">XVI</text>
  <circle cx="515" cy="165" r="1.5" fill="#C9A96E"/>
  <text x="530" y="172" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#FFFFFF" letter-spacing="0.12em">GROUP</text>

  <!-- Horizontal — Gold on Navy -->
  <rect x="680" y="130" width="280" height="80" rx="8" fill="#0A1628"/>
  <path d="M720 165 L735 150 L750 165 L735 180 Z" stroke="#C9A96E" stroke-width="2" fill="none"/>
  <text x="765" y="172" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#C9A96E" letter-spacing="0.08em">XVI</text>
  <circle cx="815" cy="165" r="1.5" fill="#C9A96E"/>
  <text x="830" y="172" font-family="Inter, sans-serif" font-size="14" font-weight="400" fill="#C9A96E" letter-spacing="0.12em">GROUP</text>

  <!-- Icon — Diamond Only -->
  <rect x="980" y="130" width="140" height="80" rx="8" fill="#FFFFFF" stroke="rgba(201,169,110,0.12)" stroke-width="1"/>
  <path d="M1050 165 L1070 145 L1090 165 L1070 185 Z" stroke="#0A1628" stroke-width="2" fill="none"/>

  <!-- Labels -->
  <text x="220" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#5A6472">Navy</text>
  <text x="520" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#5A6472">White</text>
  <text x="820" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#5A6472">Gold</text>
  <text x="1050" y="230" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#5A6472">Icon</text>

  <!-- ========== SECTION 2: TYPOGRAPHY ========== -->
  <text x="80" y="290" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5A6472" letter-spacing="0.1em">TYPOGRAPHY</text>

  <!-- English Headings -->
  <text x="80" y="325" font-family="Playfair Display, Georgia, serif" font-size="36" font-weight="700" fill="#0A1628">Strategy. Intelligence.</text>
  <text x="80" y="365" font-family="Playfair Display, Georgia, serif" font-size="36" font-weight="700" fill="#C9A96E">Operational Mastery.</text>

  <!-- English Body -->
  <text x="80" y="400" font-family="Inter, sans-serif" font-size="15" fill="#5A6472">A world-class advisory enterprise empowering organizations to transform vision into measurable sovereign performance.</text>

  <!-- English Overline -->
  <text x="80" y="440" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#C9A96E" letter-spacing="0.14em">ENTERPRISE STRATEGY &amp; TECHNOLOGY</text>

  <!-- Arabic Headings -->
  <text x="80" y="500" font-family="Amiri, serif" font-size="34" font-weight="700" fill="#0A1628" direction="rtl">نصنع المؤسسات التي تُعيد تشكيل الأسواق</text>

  <!-- Arabic Body -->
  <text x="80" y="540" font-family="Tajawal, sans-serif" font-size="15" fill="#5A6472" direction="rtl">استشارات استراتيجية وتكنولوجية للمؤسسات التي تتطلب الدقة والسرعة والتميّز التشغيلي.</text>

  <!-- Arabic Overline -->
  <text x="80" y="580" font-family="Tajawal, sans-serif" font-size="11" font-weight="500" fill="#C9A96E" letter-spacing="0.06em" direction="rtl">استراتيجيات وتكنولوجيا المؤسسات</text>

  <!-- Font Labels -->
  <rect x="820" y="310" width="300" height="200" rx="8" fill="#FFFFFF" stroke="rgba(201,169,110,0.12)" stroke-width="1"/>
  <text x="840" y="340" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628">EN Headings</text>
  <text x="840" y="358" font-family="Playfair Display, Georgia, serif" font-size="14" fill="#5A6472">Playfair Display — 700</text>
  <text x="840" y="385" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628">EN Body</text>
  <text x="840" y="403" font-family="Inter, sans-serif" font-size="14" fill="#5A6472">Inter — 400</text>
  <text x="840" y="430" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628">AR Headings</text>
  <text x="840" y="448" font-family="Amiri, serif" font-size="14" fill="#5A6472">Amiri — 700</text>
  <text x="840" y="475" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628">AR Body</text>
  <text x="840" y="493" font-family="Tajawal, sans-serif" font-size="14" fill="#5A6472">Tajawal — 400</text>

  <!-- ========== SECTION 3: COLOR PALETTE ========== -->
  <text x="80" y="630" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5A6472" letter-spacing="0.1em">COLOR SYSTEM</text>

  <!-- Primary Colors -->
  <rect x="80" y="650" width="80" height="60" rx="6" fill="#0A1628"/>
  <text x="120" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#5A6472">Navy</text>
  <text x="120" y="742" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#9AA3B0">#0A1628</text>

  <rect x="175" y="650" width="80" height="60" rx="6" fill="#C9A96E"/>
  <text x="215" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#5A6472">Gold</text>
  <text x="215" y="742" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#9AA3B0">#C9A96E</text>

  <rect x="270" y="650" width="80" height="60" rx="6" fill="#FFFFFF" stroke="rgba(201,169,110,0.12)" stroke-width="1"/>
  <text x="310" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#5A6472">White</text>
  <text x="310" y="742" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#9AA3B0">#FFFFFF</text>

  <rect x="365" y="650" width="80" height="60" rx="6" fill="#FAFAF8" stroke="rgba(201,169,110,0.12)" stroke-width="1"/>
  <text x="405" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#5A6472">Warm</text>
  <text x="405" y="742" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#9AA3B0">#FAFAF8</text>

  <rect x="460" y="650" width="80" height="60" rx="6" fill="#F4F5F7" stroke="rgba(201,169,110,0.12)" stroke-width="1"/>
  <text x="500" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#5A6472">Background</text>
  <text x="500" y="742" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#9AA3B0">#F4F5F7</text>

  <rect x="555" y="650" width="80" height="60" rx="6" fill="#ECEEF2" stroke="rgba(201,169,110,0.12)" stroke-width="1"/>
  <text x="595" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#5A6472">Alt</text>
  <text x="595" y="742" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#9AA3B0">#ECEEF2</text>

  <rect x="650" y="650" width="80" height="60" rx="6" fill="#5A6472"/>
  <text x="690" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#5A6472">Graphite</text>
  <text x="690" y="742" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#9AA3B0">#5A6472</text>

  <rect x="745" y="650" width="80" height="60" rx="6" fill="#C8CDD5"/>
  <text x="785" y="730" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" fill="#5A6472">Grey</text>
  <text x="785" y="742" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#9AA3B0">#C8CDD5</text>

  <!-- Color Ratio Bar -->
  <rect x="80" y="760" width="540" height="12" rx="3" fill="#F4F5F7"/>
  <rect x="80" y="760" width="324" height="12" rx="3" fill="#FFFFFF"/>
  <rect x="404" y="760" width="162" height="12" fill="#0A1628"/>
  <rect x="566" y="760" width="54" height="12" rx="0 3 3 0" fill="#C9A96E"/>
  <text x="80" y="785" font-family="Inter, sans-serif" font-size="9" fill="#9AA3B0">60% Background</text>
  <text x="404" y="785" font-family="Inter, sans-serif" font-size="9" fill="#9AA3B0">30% Navy</text>
  <text x="566" y="785" font-family="Inter, sans-serif" font-size="9" fill="#9AA3B0">10% Gold</text>
</svg>
