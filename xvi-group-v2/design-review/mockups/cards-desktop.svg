<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .card-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 22px; }
      .card-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 15px; }
      .card-link { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 14px; }
      .card-eyebrow { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; }
    </style>
    <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#0A1628" flood-opacity="0.06"/>
    </filter>
    <filter id="cardShadowHover" x="-5%" y="-5%" width="110%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0A1628" flood-opacity="0.1"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="600" fill="#F4F5F7"/>
  
  <!-- Section header -->
  <g transform="translate(0, 48)">
    <text class="card-eyebrow" fill="#C9A96E" x="0">OUR SERVICES</text>
    <text class="card-title" fill="#0A1628" font-size="36" y="32">Decision Architecture</text>
    <text class="card-desc" fill="#5A6472" y="64" font-size="16">Four advisory suites designed to transform vision into sovereign performance.</text>
  </g>
  
  <!-- Card 1 -->
  <g transform="translate(0, 180)">
    <rect width="376" height="320" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 32)">
      <!-- Diamond icon -->
      <path d="M24 0 L48 24 L24 48 L0 24 Z" fill="none" stroke="#C9A96E" stroke-width="2"/>
      <text x="24" y="28" text-anchor="middle" font-family="Inter" font-size="14" font-weight="600" fill="#C9A96E">AI</text>
      
      <text class="card-title" fill="#0A1628" y="80">AI Transformation</text>
      <text class="card-desc" fill="#5A6472" y="108" max-width="312">
        <tspan x="0">Strategic AI integration that delivers</tspan>
        <tspan x="0" dy="22">measurable business outcomes. From</tspan>
        <tspan x="0" dy="22">strategy to deployment.</tspan>
      </text>
      <text class="card-link" fill="#C9A96E" y="200">Learn more →</text>
    </g>
  </g>
  
  <!-- Card 2 -->
  <g transform="translate(412, 180)">
    <rect width="376" height="320" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 32)">
      <path d="M24 0 L48 24 L24 48 L0 24 Z" fill="none" stroke="#C9A96E" stroke-width="2"/>
      <text x="24" y="28" text-anchor="middle" font-family="Inter" font-size="14" font-weight="600" fill="#C9A96E">BIZ</text>
      
      <text class="card-title" fill="#0A1628" y="80">Business Strategy</text>
      <text class="card-desc" fill="#5A6472" y="108">
        <tspan x="0">Executive advisory that aligns</tspan>
        <tspan x="0" dy="22">technology with business objectives.</tspan>
        <tspan x="0" dy="22">Clarity in complexity.</tspan>
      </text>
      <text class="card-link" fill="#C9A96E" y="200">Learn more →</text>
    </g>
  </g>
  
  <!-- Card 3 -->
  <g transform="translate(824, 180)">
    <rect width="376" height="320" rx="12" fill="#FFFFFF" filter="url(#cardShadow)"/>
    <g transform="translate(32, 32)">
      <path d="M24 0 L48 24 L24 48 L0 24 Z" fill="none" stroke="#C9A96E" stroke-width="2"/>
      <text x="24" y="28" text-anchor="middle" font-family="Inter" font-size="14" font-weight="600" fill="#C9A96E">TECH</text>
      
      <text class="card-title" fill="#0A1628" y="80">Technology Advisory</text>
      <text class="card-desc" fill="#5A6472" y="108">
        <tspan x="0">Architecture, infrastructure, and</tspan>
        <tspan x="0" dy="22">platform decisions that scale. Built</tspan>
        <tspan x="0" dy="22">for sovereign performance.</tspan>
      </text>
      <text class="card-link" fill="#C9A96E" y="200">Learn more →</text>
    </g>
  </g>
</svg>