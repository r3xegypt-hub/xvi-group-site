<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="1200" height="600">
  <defs>
    <linearGradient id="goldSweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(201,169,110,0)"/>
      <stop offset="50%" stop-color="rgba(201,169,110,0.15)"/>
      <stop offset="100%" stop-color="rgba(201,169,110,0)"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="600" fill="#F4F5F7"/>

  <!-- Title -->
  <text x="600" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5A6472" letter-spacing="0.1em">BUTTON SYSTEM</text>

  <!-- ===== PRIMARY BUTTONS ===== -->
  <text x="80" y="90" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0A1628" letter-spacing="0.06em">PRIMARY</text>

  <!-- Primary — Default -->
  <rect x="80" y="105" width="180" height="48" rx="8" fill="#C9A96E"/>
  <text x="170" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="0.06em">START A CONVERSATION</text>

  <!-- Primary — Hover (with glow) -->
  <rect x="280" y="105" width="180" height="48" rx="8" fill="#D4B87A"/>
  <rect x="276" y="101" width="188" height="56" rx="12" fill="none" stroke="rgba(201,169,110,0.3)" stroke-width="2"/>
  <text x="370" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="0.06em">HOVER STATE</text>

  <!-- Primary — Dark bg -->
  <rect x="480" y="105" width="180" height="48" rx="8" fill="#0A1628"/>
  <text x="570" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#C9A96E" letter-spacing="0.06em">ON DARK</text>

  <!-- Primary — Loading -->
  <rect x="680" y="105" width="180" height="48" rx="8" fill="#C9A96E" opacity="0.6"/>
  <circle cx="770" cy="129" r="8" fill="none" stroke="#0A1628" stroke-width="2" stroke-dasharray="20 10"/>
  <text x="870" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="0.06em">LOADING</text>

  <!-- Primary — Disabled -->
  <rect x="880" y="105" width="180" height="48" rx="8" fill="#C9A96E" opacity="0.35"/>
  <text x="970" y="134" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="0.06em" opacity="0.5">DISABLED</text>

  <!-- ===== SECONDARY BUTTONS ===== -->
  <text x="80" y="195" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0A1628" letter-spacing="0.06em">SECONDARY</text>

  <rect x="80" y="210" width="180" height="48" rx="8" fill="none" stroke="#C8CDD5" stroke-width="1"/>
  <text x="170" y="239" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="0.06em">OUR APPROACH</text>

  <rect x="280" y="210" width="180" height="48" rx="8" fill="rgba(10,22,40,0.04)" stroke="#5A6472" stroke-width="1"/>
  <text x="370" y="239" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="0.06em">HOVER STATE</text>

  <rect x="480" y="210" width="180" height="48" rx="8" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <text x="570" y="239" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#FFFFFF" letter-spacing="0.06em">ON DARK</text>

  <!-- ===== GHOST BUTTONS ===== -->
  <text x="80" y="300" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0A1628" letter-spacing="0.06em">GHOST</text>

  <text x="80" y="335" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#C9A96E" letter-spacing="0.04em">Our Approach</text>
  <text x="195" y="335" font-family="Inter, sans-serif" font-size="16" fill="#C9A96E">→</text>

  <text x="280" y="335" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#B89A60" letter-spacing="0.06em">Our Approach</text>
  <text x="395" y="335" font-family="Inter, sans-serif" font-size="16" fill="#B89A60">→</text>
  <text x="280" y="355" font-family="Inter, sans-serif" font-size="9" fill="#9AA3B0">Hover: arrow shifts right</text>

  <!-- ===== SIZES ===== -->
  <text x="80" y="400" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0A1628" letter-spacing="0.06em">SIZES</text>

  <rect x="80" y="415" width="120" height="36" rx="8" fill="#C9A96E"/>
  <text x="140" y="438" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#0A1628" letter-spacing="0.06em">SMALL</text>

  <rect x="220" y="412" width="160" height="44" rx="8" fill="#C9A96E"/>
  <text x="300" y="439" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="0.06em">MEDIUM</text>

  <rect x="400" y="408" width="200" height="52" rx="8" fill="#C9A96E"/>
  <text x="500" y="440" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#0A1628" letter-spacing="0.06em">LARGE</text>

  <!-- ===== ICON BUTTON ===== -->
  <text x="680" y="400" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0A1628" letter-spacing="0.06em">ICON BUTTON</text>

  <rect x="680" y="415" width="48" height="48" rx="24" fill="#C9A96E"/>
  <text x="704" y="444" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#0A1628">→</text>

  <rect x="748" y="415" width="48" height="48" rx="24" fill="none" stroke="#C9A96E" stroke-width="1.5"/>
  <text x="772" y="444" text-anchor="middle" font-family="Inter, sans-serif" font-size="18" fill="#C9A96E">→</text>

  <!-- ===== CTA BUTTON (Full width) ===== -->
  <text x="80" y="500" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0A1628" letter-spacing="0.06em">CTA — FULL WIDTH</text>

  <rect x="80" y="515" width="600" height="56" rx="8" fill="#C9A96E"/>
  <text x="380" y="549" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="600" fill="#0A1628" letter-spacing="0.06em">SCHEDULE A CONFIDENTIAL CONSULTATION</text>

  <!-- ===== FLOATING BUTTON ===== -->
  <text x="740" y="500" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#0A1628" letter-spacing="0.06em">FLOATING / FAB</text>

  <rect x="740" y="515" width="56" height="56" rx="28" fill="#C9A96E" filter="url(#fabShadow)"/>
  <text x="768" y="549" text-anchor="middle" font-family="Inter, sans-serif" font-size="24" fill="#0A1628">↑</text>
  <defs>
    <filter id="fabShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(201,169,110,0.3)"/>
    </filter>
  </defs>
</svg>
