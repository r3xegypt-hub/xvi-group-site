<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&amp;family=Inter:wght@400;500;600;700&amp;family=Amiri:wght@400;700&amp;family=Tajawal:wght@400;500;700&amp;family=Aref+Ruqaa:wght@400;700&amp;display=swap');
    </style>
  </defs>

  <rect width="1200" height="900" fill="#F4F5F7"/>

  <text x="600" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#5A6472" letter-spacing="0.1em">ENGLISH vs ARABIC — TYPOGRAPHY &amp; COPY COMPARISON</text>

  <!-- ===== DIVIDER ===== -->
  <line x1="600" y1="60" x2="600" y2="880" stroke="rgba(201,169,110,0.2)" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- ===== ENGLISH SIDE (LEFT) ===== -->
  <text x="300" y="75" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="600" fill="#C9A96E" letter-spacing="0.1em">ENGLISH</text>

  <!-- EN: Overline -->
  <text x="80" y="120" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#C9A96E" letter-spacing="0.14em">ENTERPRISE STRATEGY &amp; TECHNOLOGY</text>

  <!-- EN: Headline -->
  <text x="80" y="165" font-family="Playfair Display, Georgia, serif" font-size="32" font-weight="700" fill="#0A1628">Building Enterprises</text>
  <text x="80" y="205" font-family="Playfair Display, Georgia, serif" font-size="32" font-weight="700" fill="#0A1628">That Move Markets</text>

  <!-- EN: Subheadline -->
  <text x="80" y="245" font-family="Inter, sans-serif" font-size="15" fill="#5A6472">Strategy and technology advisory for</text>
  <text x="80" y="265" font-family="Inter, sans-serif" font-size="15" fill="#5A6472">enterprises that demand precision,</text>
  <text x="80" y="285" font-family="Inter, sans-serif" font-size="15" fill="#5A6472">velocity, and operational mastery.</text>

  <!-- EN: CTA -->
  <rect x="80" y="310" width="200" height="48" rx="8" fill="#C9A96E"/>
  <text x="180" y="339" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="0.06em">START A CONVERSATION</text>

  <!-- EN: Body Text Sample -->
  <text x="80" y="400" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628" letter-spacing="0.06em">BODY TEXT (Inter — 400 — 1.618)</text>
  <text x="80" y="425" font-family="Inter, sans-serif" font-size="14" fill="#5A6472">XVI GROUP combines strategic advisory with</text>
  <text x="80" y="445" font-family="Inter, sans-serif" font-size="14" fill="#5A6472">technology implementation to deliver measurable</text>
  <text x="80" y="465" font-family="Inter, sans-serif" font-size="14" fill="#5A6472">outcomes for enterprises across the Middle East.</text>

  <!-- EN: Quote Sample -->
  <text x="80" y="520" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628" letter-spacing="0.06em">QUOTE (Playfair — Italic)</text>
  <text x="80" y="555" font-family="Playfair Display, Georgia, serif" font-size="20" font-style="italic" fill="#0A1628">"We combine strategic vision with</text>
  <text x="80" y="580" font-family="Playfair Display, Georgia, serif" font-size="20" font-style="italic" fill="#0A1628">execution capability to transform</text>
  <text x="80" y="605" font-family="Playfair Display, Georgia, serif" font-size="20" font-style="italic" fill="#0A1628">ambition into sovereign performance."</text>

  <!-- EN: Stats -->
  <text x="80" y="660" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628" letter-spacing="0.06em">STATS</text>
  <text x="80" y="695" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#C9A96E">200+</text>
  <text x="80" y="715" font-family="Inter, sans-serif" font-size="13" fill="#5A6472">Projects Delivered</text>

  <text x="220" y="695" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#C9A96E">98%</text>
  <text x="220" y="715" font-family="Inter, sans-serif" font-size="13" fill="#5A6472">Client Retention</text>

  <!-- ===== ARABIC SIDE (RIGHT) ===== -->
  <text x="900" y="75" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="12" font-weight="600" fill="#C9A96E" letter-spacing="0.06em">العربية</text>

  <!-- AR: Overline -->
  <text x="1120" y="120" text-anchor="end" font-family="Tajawal, sans-serif" font-size="11" font-weight="500" fill="#C9A96E" letter-spacing="0.06em">استراتيجيات وتكنولوجيا المؤسسات</text>

  <!-- AR: Headline -->
  <text x="1120" y="165" text-anchor="end" font-family="Amiri, serif" font-size="32" font-weight="700" fill="#0A1628">نصنع المؤسسات</text>
  <text x="1120" y="210" text-anchor="end" font-family="Amiri, serif" font-size="32" font-weight="700" fill="#0A1628">التي تُعيد تشكيل الأسواق</text>

  <!-- AR: Subheadline -->
  <text x="1120" y="255" text-anchor="end" font-family="Tajawal, sans-serif" font-size="15" fill="#5A6472">استشارات استراتيجية وتكنولوجية للمؤسسات</text>
  <text x="1120" y="278" text-anchor="end" font-family="Tajawal, sans-serif" font-size="15" fill="#5A6472">التي تتطلب الدقة والسرعة والتميّز التشغيلي.</text>

  <!-- AR: CTA -->
  <rect x="800" y="310" width="200" height="48" rx="8" fill="#C9A96E"/>
  <text x="900" y="339" text-anchor="middle" font-family="Tajawal, sans-serif" font-size="14" font-weight="600" fill="#0A1628" letter-spacing="0.04em">نبدأ الحوار</text>

  <!-- AR: Body Text Sample -->
  <text x="1120" y="400" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628" letter-spacing="0.06em">نص أساسي (Tajawal — 400 — 1.8)</text>
  <text x="1120" y="428" text-anchor="end" font-family="Tajawal, sans-serif" font-size="14" fill="#5A6472">تجمع XVI GROUP بين الاستشارات الاستراتيجية</text>
  <text x="1120" y="450" text-anchor="end" font-family="Tajawal, sans-serif" font-size="14" fill="#5A6472">وتطبيق التكنولوجيا لتحقيق نتائج قابلة للقياس</text>
  <text x="1120" y="472" text-anchor="end" font-family="Tajawal, sans-serif" font-size="14" fill="#5A6472">للمؤسسات في جميع أنحاء الشرق الأوسط.</text>

  <!-- AR: Quote Sample -->
  <text x="1120" y="525" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628" letter-spacing="0.06em">اقتباس (Aref Ruqaa)</text>
  <text x="1120" y="565" text-anchor="end" font-family="Aref Ruqaa, serif" font-size="22" fill="#0A1628">"نجمع بين الرؤية الاستراتيجية والقدرة</text>
  <text x="1120" y="595" text-anchor="end" font-family="Aref Ruqaa, serif" font-size="22" fill="#0A1628">التنفيذية لتحويل الطموح إلى أداء سيادي"</text>

  <!-- AR: Stats -->
  <text x="1120" y="660" text-anchor="end" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628" letter-spacing="0.06em">إحصائيات</text>
  <text x="1120" y="695" text-anchor="end" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#C9A96E">٢٠٠+</text>
  <text x="1120" y="715" text-anchor="end" font-family="Tajawal, sans-serif" font-size="13" fill="#5A6472">مشروع تم تسليمه</text>

  <text x="940" y="695" text-anchor="end" font-family="Inter, sans-serif" font-size="36" font-weight="700" fill="#C9A96E">٩٨%</text>
  <text x="940" y="715" text-anchor="end" font-family="Tajawal, sans-serif" font-size="13" fill="#5A6472">الاحتفاظ بالعملاء</text>

  <!-- ===== COMPARISON NOTES ===== -->
  <rect x="80" y="760" width="1040" height="120" rx="8" fill="#FFFFFF" stroke="rgba(201,169,110,0.12)" stroke-width="1"/>
  <text x="600" y="790" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="600" fill="#0A1628" letter-spacing="0.06em">KEY DIFFERENCES</text>

  <text x="100" y="820" font-family="Inter, sans-serif" font-size="11" fill="#5A6472">
    <tspan font-weight="600" fill="#0A1628">English:</tspan> Playfair Display serif headings, Inter body, 1.618 line-height, -0.03em tracking
  </text>
  <text x="100" y="840" font-family="Tajawal, sans-serif" font-size="11" fill="#5A6472">
    <tspan font-weight="600" fill="#0A1628">Arabic:</tspan> Amiri naskh headings, Tajawal body, 1.8 line-height, 0 tracking, Aref Ruqaa for quotes
  </text>
  <text x="100" y="860" font-family="Inter, sans-serif" font-size="11" fill="#5A6472">
    <tspan font-weight="600" fill="#0A1628">Copy:</tspan> Not translated — each language is written natively with its own executive register
  </text>
</svg>
