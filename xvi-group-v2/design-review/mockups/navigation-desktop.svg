<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 72" width="1440" height="72">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap');
      .nav-text { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 500; }
      .nav-cta { font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; }
    </style>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="72" fill="#FFFFFF"/>
  <rect y="71" width="1440" height="1" fill="#ECEEF2"/>
  
  <!-- Logo -->
  <g transform="translate(32, 20)">
    <!-- Diamond mark -->
    <path d="M16 0 L32 16 L16 32 L0 16 Z" fill="none" stroke="#0A1628" stroke-width="2"/>
    <text x="16" y="20" text-anchor="middle" class="nav-text" font-weight="600" fill="#0A1628" font-size="10">XVI</text>
    <!-- Meridian line -->
    <line x1="38" y1="16" x2="58" y2="16" stroke="#C9A96E" stroke-width="1.5"/>
    <!-- GROUP text -->
    <text x="64" y="20" class="nav-text" fill="#0A1628" letter-spacing="0.15em" font-size="12">GROUP</text>
  </g>
  
  <!-- Nav items -->
  <g class="nav-text" fill="#5A6472">
    <text x="480" y="42">Services</text>
    <text x="576" y="42">Industries</text>
    <text x="672" y="42">About</text>
    <text x="748" y="42">Insights</text>
    <text x="832" y="42">Careers</text>
  </g>
  
  <!-- Active nav item (Gold) -->
  <text x="480" y="42" class="nav-text" fill="#C9A96E">Services</text>
  
  <!-- Language toggle -->
  <g transform="translate(1240, 26)">
    <text class="nav-text" fill="#C9A96E" font-size="13">EN</text>
    <text x="24" class="nav-text" fill="#C8CDD5" font-size="13">AR</text>
  </g>
  
  <!-- CTA button -->
  <g transform="translate(1320, 16)">
    <rect width="88" height="40" rx="8" fill="#C9A96E"/>
    <text x="44" y="26" text-anchor="middle" class="nav-cta" fill="#0A1628">Contact</text>
  </g>
</svg>