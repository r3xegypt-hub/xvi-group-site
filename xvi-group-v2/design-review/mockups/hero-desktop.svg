<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap');
      .display { font-family: 'Playfair Display', Georgia, serif; font-weight: 700; }
      .body { font-family: 'Inter', sans-serif; font-weight: 400; }
      .eyebrow { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
      .stat-num { font-family: 'Inter', sans-serif; font-weight: 700; font-size: 32px; }
      .stat-label { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; }
      .cta-primary { font-family: 'Inter', sans-serif; font-weight: 600; font-size: 16px; }
      .cta-secondary { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 16px; }
    </style>
    <linearGradient id="heroBg" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#FAFAF8"/>
      <stop offset="100%" stop-color="#F4F5F7"/>
    </linearGradient>
    <radialGradient id="heroSpotlight" cx="0.5" cy="0.4" r="0.6">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FAFAF8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1440" height="900" fill="url(#heroBg)"/>
  <rect width="1440" height="900" fill="url(#heroSpotlight)"/>
  
  <!-- Content area -->
  <g transform="translate(120, 200)">
    <!-- Eyebrow -->
    <text class="eyebrow" fill="#C9A96E">DECISION ARCHITECTURE</text>
    
    <!-- Gold underline -->
    <line x1="0" y1="24" x2="200" y2="24" stroke="#C9A96E" stroke-width="1.5"/>
    
    <!-- Headline -->
    <text class="display" fill="#0A1628" font-size="64" y="80" letter-spacing="-0.02em">Strategy. Intelligence.</text>
    <text class="display" fill="#0A1628" font-size="64" y="148" letter-spacing="-0.02em">Operational Mastery.</text>
    
    <!-- Subheadline -->
    <text class="body" fill="#5A6472" font-size="18" y="200" max-width="560">
      <tspan x="0">A world-class advisory enterprise empowering</tspan>
      <tspan x="0" dy="28">organizations to transform vision into</tspan>
      <tspan x="0" dy="28">measurable sovereign performance.</tspan>
    </text>
    
    <!-- CTA buttons -->
    <g transform="translate(0, 340)">
      <!-- Primary button -->
      <rect width="160" height="48" rx="8" fill="#C9A96E"/>
      <text x="80" y="30" text-anchor="middle" class="cta-primary" fill="#0A1628">Get Started →</text>
      
      <!-- Secondary link -->
      <text x="192" y="30" class="cta-secondary" fill="#5A6472">Our Approach →</text>
    </g>
    
    <!-- Meridian line -->
    <line x1="0" y1="420" x2="1200" y2="420" stroke="#C9A96E" stroke-width="1.5" opacity="0.6"/>
    
    <!-- Stats row -->
    <g transform="translate(0, 460)">
      <g>
        <text class="stat-num" fill="#C9A96E">4</text>
        <text class="stat-label" fill="#5A6472" y="24">Advisory Suites</text>
      </g>
      <g transform="translate(200, 0)">
        <text class="stat-num" fill="#C9A96E">24/7</text>
        <text class="stat-label" fill="#5A6472" y="24">Support</text>
      </g>
      <g transform="translate(400, 0)">
        <text class="stat-num" fill="#C9A96E">+40%</text>
        <text class="stat-label" fill="#5A6472" y="24">Efficiency</text>
      </g>
      <g transform="translate(600, 0)">
        <text class="stat-num" fill="#C9A96E">100%</text>
        <text class="stat-label" fill="#5A6472" y="24">Sovereign</text>
      </g>
    </g>
  </g>
  
  <!-- AI Node Network (right side) -->
  <g transform="translate(1000, 300)" opacity="0.3">
    <!-- Grid of diamond nodes -->
    <g fill="none" stroke="#0A1628" stroke-width="1">
      <!-- Horizontal lines -->
      <line x1="0" y1="0" x2="200" y2="0"/>
      <line x1="0" y1="80" x2="200" y2="80"/>
      <line x1="0" y1="160" x2="200" y2="160"/>
      <!-- Vertical lines -->
      <line x1="0" y1="0" x2="0" y2="160"/>
      <line x1="100" y1="0" x2="100" y2="160"/>
      <line x1="200" y1="0" x2="200" y2="160"/>
    </g>
    <!-- Diamond nodes -->
    <g fill="#0A1628">
      <path d="M0 -6 L6 0 L0 6 L-6 0 Z"/>
      <path d="M100 -6 L106 0 L100 6 L94 0 Z"/>
      <path d="M200 -6 L206 0 L200 6 L194 0 Z"/>
      <path d="M0 74 L6 80 L0 86 L-6 80 Z"/>
      <path d="M100 74 L106 80 L100 86 L94 80 Z" fill="#C9A96E"/>
      <path d="M200 74 L206 80 L200 86 L194 80 Z"/>
      <path d="M0 154 L6 160 L0 166 L-6 160 Z"/>
      <path d="M100 154 L106 160 L100 166 L94 160 Z"/>
      <path d="M200 154 L206 160 L200 166 L194 160 Z"/>
    </g>
  </g>
</svg>