<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 375 2400" width="375" height="2400">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&amp;family=Inter:wght@400;500;600&amp;display=swap');
      .section-label { font-family: 'Inter', sans-serif; font-weight: 500; font-size: 10px; letter-spacing: 0.12em; text-transform: uppercase; fill: #C9A96E; }
      .section-title { font-family: 'Playfair Display', Georgia, serif; font-weight: 600; font-size: 24px; fill: #0A1628; }
      .section-desc { font-family: 'Inter', sans-serif; font-weight: 400; font-size: 14px; fill: #5A6472; }
    </style>
  </defs>
  
  <!-- HERO -->
  <rect width="375" height="600" fill="#FAFAF8"/>
  <g transform="translate(24, 120)">
    <text class="section-label">DECISION ARCHITECTURE</text>
    <text font-family="Playfair Display" font-weight="700" font-size="32" fill="#0A1628" y="40">Strategy.</text>
    <text font-family="Playfair Display" font-weight="700" font-size="32" fill="#0A1628" y="80">Intelligence.</text>
    <text font-family="Playfair Display" font-weight="700" font-size="32" fill="#0A1628" y="120">Operational Mastery.</text>
    <text font-family="Inter" font-weight="400" font-size="15" fill="#5A6472" y="168">A world-class advisory enterprise.</text>
    <rect y="204" width="327" height="48" rx="8" fill="#C9A96E"/>
    <text x="163" y="234" text-anchor="middle" font-family="Inter" font-weight="600" font-size="16" fill="#0A1628">Get Started →</text>
  </g>
  
  <!-- SERVICES (stacked) -->
  <rect y="600" width="375" height="600" fill="#F4F5F7"/>
  <g transform="translate(24, 648)">
    <text class="section-label">OUR SERVICES</text>
    <text class="section-title" y="28">Decision Architecture</text>
  </g>
  <g transform="translate(24, 740)">
    <rect width="327" height="200" rx="12" fill="#FFFFFF"/>
    <text x="24" y="48" font-family="Playfair Display" font-weight="600" font-size="20" fill="#0A1628">AI Transformation</text>
    <text x="24" y="76" font-family="Inter" font-weight="400" font-size="14" fill="#5A6472">Strategic AI integration.</text>
    
    <rect y="224" width="327" height="200" rx="12" fill="#FFFFFF"/>
    <text x="24" y="272" font-family="Playfair Display" font-weight="600" font-size="20" fill="#0A1628">Business Strategy</text>
    <text x="24" y="300" font-family="Inter" font-weight="400" font-size="14" fill="#5A6472">Executive advisory.</text>
  </g>
  
  <!-- FOOTER -->
  <rect y="2000" width="375" height="400" fill="#0A1628"/>
  <g transform="translate(24, 2048)">
    <text font-family="Playfair Display" font-weight="700" font-size="24" fill="#FFFFFF">XVI GROUP</text>
    <text font-family="Playfair Display" font-weight="700" font-size="24" fill="#C9A96E" y="36">Strategy. Intelligence.</text>
  </g>
  
  <!-- Bottom tab bar -->
  <rect y="2352" width="375" height="48" fill="#FFFFFF"/>
  <line x1="0" y1="2352" x2="375" y2="2352" stroke="#ECEEF2" stroke-width="1"/>
  <g transform="translate(40, 2368)">
    <circle cx="8" cy="8" r="8" fill="#C9A96E"/>
    <text x="0" y="28" font-family="Inter" font-weight="500" font-size="10" fill="#C9A96E">Home</text>
    <text x="80" y="28" font-family="Inter" font-weight="500" font-size="10" fill="#5A6472">Services</text>
    <text x="160" y="28" font-family="Inter" font-weight="500" font-size="10" fill="#5A6472">About</text>
    <text x="260" y="28" font-family="Inter" font-weight="500" font-size="10" fill="#5A6472">Contact</text>
  </g>
</svg>